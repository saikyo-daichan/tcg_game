const ALL_CARDS = Object.keys(DECKS).reduce((acc, key) => acc.concat(DECKS[key]), []).concat(NEUTRAL);

function createCard(base) {
    let hp = base.hp || 0; let atk = base.atk || 0;
    let cd = base.countdown !== undefined ? base.countdown : -1;
    return { name: base.name, type: base.type, cost: base.cost, atk: atk, hp: hp, maxHp: hp, color: base.color,
        id: Math.random(), ready: false, rushThisTurn: false, attacksLeft: 1, baseAtk: atk, baseHp: hp,
        ability: base.ability ? [...base.ability] : [], countdown: cd,
        textColor: getTextColor(base.color), desc: base.desc || '', 
        isEvolved: false, x: 400, y: 800, targetX: 400, targetY: 800 };
}

function buildDeck(deckKey) {
    let deck = [];
    if (deckKey === 'SATAN') {
        SATAN_DECK.forEach(c => { deck.push(createCard(c)); deck.push(createCard(c)); deck.push(createCard(c)); });
        return deck.sort(() => Math.random() - 0.5);
    }
    
    let classPool = [...DECKS[deckKey]]; classPool.sort(() => Math.random() - 0.5);
    for(let i=0; i<30; i++) deck.push(createCard(classPool[i % classPool.length]));
    let neutralPool = [...NEUTRAL]; neutralPool.sort(() => Math.random() - 0.5);
    for (let i=0; i<10; i++) deck.push(createCard(neutralPool[i % neutralPool.length]));
    return deck.sort(() => Math.random() - 0.5);
}

function drawCardToHand(isPlayer, amount = 1) {
    try { let hand = isPlayer ? playerHand : enemyHand; let deck = isPlayer ? playerDeck : enemyDeck;
        for(let i=0; i<amount; i++) { if (deck.length > 0 && hand.length < 9) hand.push(deck.pop()); }
    } catch(e) {}
}

function initGame(mode, playerDeckKey = 'ROYAL') {
    gameMode = mode;
    if (mode === 'NORMAL' || mode === 'BOSS') {
        playerDeckType = playerDeckKey; playerDeck = buildDeck(playerDeckKey);
        if (mode === 'BOSS') {
            enemyDeckType = 'BOSS'; enemyDeck = [];
            for(let i=0; i<40; i++) enemyDeck.push(createCard(BOSS_DECK[Math.floor(Math.random()*BOSS_DECK.length)]));
        } else {
            const deckKeys = Object.keys(DECKS); enemyDeckType = deckKeys[Math.floor(Math.random() * deckKeys.length)];
            enemyDeck = buildDeck(enemyDeckType);
        }
        startGame();
    } else if (mode === 'DRAFT') {
        gameState = 'DRAFT'; playerDeck = []; draftCount = 0; generateDraftOptions();
    }
}

function generateDraftOptions() {
    draftOptions = [];
    for(let i=0; i<3; i++) draftOptions.push(createCard(ALL_CARDS[Math.floor(Math.random() * ALL_CARDS.length)]));
}

    turn = 1; globalTurn = 1;
    playerHP = 20; enemyHP = gameMode === 'BOSS' ? 100 : 20;
    playerPP = 1; playerMaxPP = 1; enemyPP = 1; enemyMaxPP = 1;
    playerEP = 2; enemyEP = 3;

    playerHand = []; playerBoard = []; enemyHand = []; enemyBoard = [];
    draggedCard = null; activeAttacker = null; isHandHidden = false; popups = [];

    if (gameMode === 'DRAFT') {
        enemyDeck = []; for(let i=0; i<40; i++) enemyDeck.push(createCard(ALL_CARDS[Math.floor(Math.random()*ALL_CARDS.length)]));
    }

    drawCardToHand(true, 4); drawCardToHand(false, 4);
    gameState = 'BATTLE';
    showPopup("BATTLE START!!", '#fff');
    if (gameMode === 'BOSS') showPopup("黒き甲冑の暗黒卿 現る", '#f00');
}

let audioCtx = null;
function initAudio() { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); else if (audioCtx.state === 'suspended') audioCtx.resume(); } catch(e) {} }
function playTone(f, t, d, v=0.1) { try { if (!audioCtx) return; const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); o.type = t; o.frequency.value = f; g.gain.setValueAtTime(v, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d); } catch(e) {} }
function playSummonSound() { playTone(300, 'triangle', 0.15); playTone(600, 'triangle', 0.1, 0.05); }
function playAttackSound() { playTone(150, 'sawtooth', 0.12, 0.15); }
function playDamageSound() { playTone(80, 'sawtooth', 0.25, 0.2); }
function playSpellSound() { playTone(800, 'sine', 0.2, 0.1); playTone(1200, 'sine', 0.3, 0.1, 0.1); }
function playHealSound() { playTone(523.25, 'triangle', 0.15, 0.1); playTone(783.99, 'triangle', 0.2, 0.1, 0.08); }

function playEvolveSound() { playTone(400, 'sine', 0.1); playTone(800, 'sine', 0.1, 0.1, 0.1); playTone(1200, 'sine', 0.4, 0.2, 0.2); }

function showPopup(text, color='#fff') { popups.push({ text: text, color: color, y: 400, timer: 70 }); }

function updateAuras() {
    let pAuraAtk = 0, pAuraHp = 0, eAuraAtk = 0, eAuraHp = 0;
    playerBoard.forEach(c => { if(c.type==='AMULET' && c.ability.includes('AURA_ATK_1')) pAuraAtk += 1; if(c.type==='AMULET' && c.ability.includes('AURA_DEF_2')) pAuraHp += 2; });
    enemyBoard.forEach(c => { if(c.type==='AMULET' && c.ability.includes('AURA_ATK_1')) eAuraAtk += 1; if(c.type==='AMULET' && c.ability.includes('AURA_DEF_2')) eAuraHp += 2; });

    playerBoard.forEach(c => { if(c.type==='FOLLOWER') { c.atk = c.baseAtk + pAuraAtk; c.maxHp = c.baseHp + pAuraHp; if(c.hp > c.maxHp) c.hp = c.maxHp; }});
    enemyBoard.forEach(c => { if(c.type==='FOLLOWER') { c.atk = c.baseAtk + eAuraAtk; c.maxHp = c.baseHp + eAuraHp; if(c.hp > c.maxHp) c.hp = c.maxHp; }});
}

function processTurnStartCountdown(isPlayer) {
    try {
        let board = isPlayer ? playerBoard : enemyBoard;
        board.forEach(c => {
            if (c.type === 'AMULET' && c.countdown > 0) {
                c.countdown--;
                if (c.countdown === 0) c.hp = 0; 
                else showPopup(`カウント: ${c.countdown}`, '#00bfa5');
            }
        });

    } catch(e) {}
}

                    if (ab === 'DEATH_SUMMON_SKELETON_2') { if(newPlayerBoard.length<5) newPlayerBoard.push(createCard(TOKENS.SKELETON)); if(newPlayerBoard.length<5) newPlayerBoard.push(createCard(TOKENS.SKELETON)); }
                    if (ab === 'DEATH_SUMMON_2_3_WARD') { if(newPlayerBoard.length<5) newPlayerBoard.push(createCard({name:'重装兵',type:'FOLLOWER',cost:3,atk:2,hp:3,ability:['WARD'],color:'#777',desc:'【守護】'})); }

                    if (ab === 'DEATH_SUMMON_DRAGON_5_5') { if(newPlayerBoard.length<5) newPlayerBoard.push(createCard(TOKENS.DRAGON_5_5)); }
                    if (ab === 'DEATH_ADD_DECK_ARTIFACT_2') { playerDeck.push(createCard(TOKENS.ARTIFACT)); playerDeck.push(createCard(TOKENS.ARTIFACT)); }

                if(c.type==='FOLLOWER') enemyGrave++; 
                c.ability.forEach(ab => {
                    if (ab === 'DEATH_DRAW_1') drawCardToHand(false, 1);
                    if (ab === 'DEATH_SUMMON_SKELETON') if(newEnemyBoard.length<5) newEnemyBoard.push(createCard(TOKENS.SKELETON));
                    if (ab === 'DEATH_SUMMON_SKELETON_2') { if(newEnemyBoard.length<5) newEnemyBoard.push(createCard(TOKENS.SKELETON)); if(newEnemyBoard.length<5) newEnemyBoard.push(createCard(TOKENS.SKELETON)); }
                    if (ab === 'DEATH_SUMMON_2_3_WARD') { if(newEnemyBoard.length<5) newEnemyBoard.push(createCard({name:'重装兵',type:'FOLLOWER',cost:3,atk:2,hp:3,ability:['WARD'],color:'#777',desc:'【守護】'})); }
                    if (ab === 'DEATH_RAMP_1') enemyMaxPP = Math.min(10, enemyMaxPP+1);
                    if (ab === 'DEATH_HEAL_LEADER_2') { enemyHP = Math.min(20, enemyHP+2); playHealSound(); showPopup('2回復！', '#fbc02d'); }
                    if (ab === 'DEATH_SUMMON_ZOMBIE_2') { if(newEnemyBoard.length<5) newEnemyBoard.push(createCard(TOKENS.ZOMBIE)); if(newEnemyBoard.length<5) newEnemyBoard.push(createCard(TOKENS.ZOMBIE)); }
                    if (ab === 'DEATH_SUMMON_DRAGON_5_5') { if(newEnemyBoard.length<5) newEnemyBoard.push(createCard(TOKENS.DRAGON_5_5)); }
                    if (ab === 'DEATH_ADD_DECK_ARTIFACT_2') { enemyDeck.push(createCard(TOKENS.ARTIFACT)); enemyDeck.push(createCard(TOKENS.ARTIFACT)); }
                    if (ab === 'DEATH_ADD_3_FAIRY') { for(let i=0; i<3; i++){ if(enemyHand.length<9) enemyHand.push(createCard(TOKENS.FAIRY)); } }
                    if (ab === 'DEATH_DRAW_2_SELF_DMG_2') { drawCardToHand(false, 2); enemyHP -= 2; }
                    if (ab === 'DEATH_AOE_1') { playerBoard.forEach(ec => { if(!ec.ability.includes('INVINCIBLE')) ec.hp -= 1; }); }

        });
        enemyBoard = newEnemyBoard;
        updateAuras();
    } catch(e) { console.error("checkDeath err"); }
}

function executeAbility(card, isPlayer, targetEnemy = null) {
    try {
        let targetBoard = isPlayer ? enemyBoard : playerBoard;
        let myBoard = isPlayer ? playerBoard : enemyBoard;
        let myHand = isPlayer ? playerHand : enemyHand;
        let myDeck = isPlayer ? playerDeck : enemyDeck;

        card.ability.forEach(ab => {
            if (ab === 'SPELL_KILL_TARGET') { if (targetEnemy && !targetEnemy.ability.includes('INVINCIBLE')) { targetEnemy.hp = 0; playSpellSound(); showPopup(`破壊した！`, '#ff0000'); } }
            else if (ab === 'SPELL_KILL_RANDOM') { let valid = targetBoard.filter(c=>!c.ability.includes('INVINCIBLE')); if (valid.length > 0) { valid[Math.floor(Math.random() * valid.length)].hp = 0; playSpellSound(); showPopup(`ランダム破壊！`, '#ff0000'); } }
            else if (ab === 'SPELL_WIPE_BOARD') { targetBoard.forEach(c => { if(!c.ability.includes('INVINCIBLE')) c.hp = 0; }); myBoard.forEach(c => { if(c !== card && !c.ability.includes('INVINCIBLE')) c.hp = 0; }); playDamageSound(); showPopup(`盤面全破壊！`, '#ff0000'); }
            else if (ab === 'TARGET_ENEMY_AMULET_DESTROY') { if(targetEnemy && targetEnemy.type === 'AMULET') { targetEnemy.hp = 0; playSpellSound(); showPopup('アミュレット破壊！', '#ff0000');} else if(targetEnemy){ playErrorSound(); showPopup('アミュレット対象外', '#f00');} }
            
            else if (ab === 'SPELL_RAMP_1' || ab === 'FANFARE_RAMP_1') { if (isPlayer) { playerMaxPP = Math.min(10, playerMaxPP + 1); playerPP++; } else { enemyMaxPP = Math.min(10, enemyMaxPP + 1); enemyPP++; } playSpellSound(); showPopup(`PP最大値アップ！`, '#00bfa5'); }
            
            else if (ab === 'SPELL_ADVANCE_COUNTDOWN_1' || ab === 'FANFARE_ADVANCE_COUNTDOWN_1') {
                myBoard.forEach(c => { if (c.type === 'AMULET' && c.countdown > 0) { c.countdown--; if (c.countdown === 0) c.hp = 0; } });
                playSpellSound(); showPopup('カウントダウン加速！', '#00bfa5');
            }

            else if (ab === 'SPELL_TUTOR_COST_1' || ab === 'FANFARE_TUTOR_COST_1') {
                let targetIdx = myDeck.findIndex(c => c.cost === 1);
                if (targetIdx !== -1) { let tc = myDeck.splice(targetIdx, 1)[0]; if (myHand.length < 9) myHand.push(tc); playSpellSound(); showPopup(`コスト1サーチ！`, '#1976d2'); myDeck.sort(() => Math.random() - 0.5); }
            }

            else if (ab === 'FANFARE_ROACH_BUFF') { card.atk += cardsPlayedThisTurn; card.baseAtk += cardsPlayedThisTurn; playSpellSound(); showPopup(`コンボ！攻撃力+${cardsPlayedThisTurn}！`, '#689f38'); }
            else if (ab === 'FANFARE_COMBO_X_BUFF_0_X') { if(cardsPlayedThisTurn > 0){ card.hp += cardsPlayedThisTurn; card.baseHp += cardsPlayedThisTurn; card.maxHp += cardsPlayedThisTurn; playSpellSound(); showPopup(`コンボ！体力+${cardsPlayedThisTurn}！`, '#689f38'); } }
            
            else if (ab === 'SPELL_DRAW_1' || ab === 'FANFARE_DRAW_1') { drawCardToHand(isPlayer, 1); playSpellSound(); }
            else if (ab === 'SPELL_DRAW_2' || ab === 'FANFARE_DRAW_2') { drawCardToHand(isPlayer, 2); playSpellSound(); showPopup(`2枚ドロー！`, '#1976d2'); }
            
            else if (ab === 'FANFARE_NECRO_4_TARGET_ENEMY_4') { 
                if ((isPlayer && playerGrave >= 4) || (!isPlayer && enemyGrave >= 4)) { 
                    if (isPlayer) playerGrave -= 4; else enemyGrave -= 4; 
                    if (targetEnemy && !targetEnemy.ability.includes('INVINCIBLE')) targetEnemy.hp -= 4; else { if(isPlayer) enemyHP -= 4; else playerHP -= 4; } 
                    playSpellSound(); showPopup(`ネクロマンス(4):4ダメージ！`, '#aa00ff'); 
                } 
            }

            else if (ab.startsWith('FANFARE_HEAL_LEADER_') || ab.startsWith('SPELL_HEAL_LEADER_')) {
                let parts = ab.split('_'); let h = parseInt(parts[parts.length - 1]);
                if (isPlayer) playerHP = Math.min(20, playerHP + h); else enemyHP = Math.min(20, enemyHP + h); playHealSound(); showPopup(`顔面${h}回復！`, '#fbc02d');
            }
            else if (ab.startsWith('FANFARE_HEAL_ALL_')) {
                let parts = ab.split('_'); let h = parseInt(parts[parts.length - 1]);
                myBoard.forEach(c => {if(c.type==='FOLLOWER') c.hp = Math.min(c.maxHp, c.hp + h)}); playHealSound(); showPopup(`全体回復！`, '#fbc02d');
            }

            else if (ab === 'FANFARE_SELF_DMG_2' || ab === 'SPELL_SELF_DMG_2') { if (isPlayer) playerHP -= 2; else enemyHP -= 2; playDamageSound(); showPopup(`自身に2ダメ！`, '#b71c1c'); }
            
            else if (ab.startsWith('SPELL_BUFF_ALL_')) {
                let parts = ab.split('_'); let a = parseInt(parts[3]); let h = parseInt(parts[4]);
                myBoard.forEach(c => { if(c.type==='FOLLOWER'){ c.atk+=a; c.baseAtk+=a; c.hp+=h; c.maxHp+=h; c.baseHp+=h; }}); playSpellSound(); showPopup(`全体強化！`, '#ff9800');
            }

            else if (ab.startsWith('SPELL_AOE_') || ab.startsWith('FANFARE_AOE_')) {
                let parts = ab.split('_'); let d = parseInt(parts[parts.length - 1]);
                targetBoard.forEach(c => { if(c.type==='FOLLOWER' && !c.ability.includes('INVINCIBLE')) c.hp -= d; }); playSpellSound(); showPopup(`全体に${d}ダメージ！`, '#1e88e5');
            }
            
            else if (ab.startsWith('FANFARE_FACE_DMG_') || ab.startsWith('SPELL_BURN_FACE_')) {
                let parts = ab.split('_'); let d = parseInt(parts[parts.length - 1]);
                if (isPlayer) enemyHP -= d; else playerHP -= d; playSpellSound(); showPopup(`顔面に${d}ダメ！`, '#ff5722');
            }

            else if (ab.startsWith('TARGET_ENEMY_DEBUFF_')) {
                let parts = ab.split('_'); let a = parseInt(parts[3]); let h = parseInt(parts[4]);
                if (targetEnemy && targetEnemy.type==='FOLLOWER') { targetEnemy.atk = Math.max(0, targetEnemy.atk - a); targetEnemy.baseAtk = Math.max(0, targetEnemy.baseAtk - a); targetEnemy.hp -= h; targetEnemy.maxHp -= h; targetEnemy.baseHp -= h; playSpellSound(); showPopup(`-${a}/-${h} デバフ！`, '#800080'); }
            }
            else if (ab.startsWith('TARGET_ENEMY_')) {
                let parts = ab.split('_'); let d = parseInt(parts[2]);
                if (targetEnemy && targetEnemy.type==='FOLLOWER' && !targetEnemy.ability.includes('INVINCIBLE')) { targetEnemy.hp -= d; playSpellSound(); showPopup(`${d}ダメージ！`, '#1565c0'); }
                else if (!targetEnemy) { if(isPlayer) enemyHP -= d; else playerHP -= d; playSpellSound(); showPopup(`顔面に${d}ダメ！`, '#1565c0'); }
                if (ab.includes('SELF_DMG_2')) { if(isPlayer) playerHP-=2; else enemyHP-=2; }
            }
        });
        updateAuras(); checkDeath();
    } catch(e) { console.error("executeAbility Error safely caught"); }
}

function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
    let clientX = e.clientX; let clientY = e.clientY;
    if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
    else if (e.changedTouches && e.changedTouches.length > 0) { clientX = e.changedTouches[0].clientX; clientY = e.changedTouches[0].clientY; }
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}

function handleInputStart(e) {
    if (e.cancelable) e.preventDefault(); initAudio(); const pos = getPointerPos(e); const mx = pos.x; const my = pos.y;
    if (gameState === 'MAIN_MENU') {
        if (my >= 250 && my <= 350) { gameState = 'SELECT'; gameMode = 'NORMAL'; }
        if (my >= 400 && my <= 500) { initGame('DRAFT'); }
        if (my >= 550 && my <= 650) { gameState = 'SELECT'; gameMode = 'BOSS'; }
        return;
    }
    if (gameState === 'SELECT') {
        const keys = Object.keys(DECKS);
        keys.forEach((key, idx) => { let dx = 70 + (idx % 2) * 340; let dy = 160 + Math.floor(idx / 2) * 150; if (mx >= dx && mx <= dx + 310 && my >= dy && my <= dy + 110) initGame(gameMode, key); });
        return;
    }
    if (gameState === 'DRAFT') {
        for(let i=0; i<3; i++) {
            let dx = 150 + i * 180; let dy = 350;
            if (mx >= dx && mx <= dx + 160 && my >= dy && my <= dy + 230) {
                playerDeck.push(createCard(draftOptions[i])); draftCount++;
                if (draftCount >= 40) { startGame(); } else { generateDraftOptions(); }
            }
        }
        return;
    }
    if (gameState === 'GAMEOVER') { if (mx >= 300 && mx <= 500 && my >= 550 && my <= 600) gameState = 'MAIN_MENU'; return; }
    
    if (mx >= 680 && mx <= 780 && my >= 650 && my <= 700) { isHandHidden = !isHandHidden; return; }
    if (turn === 1 && playerEP > 0 && globalTurn >= 9 && mx >= 10 && mx <= 110 && my >= 550 && my <= 600) { evolveMode = !evolveMode; return; }
    if (turn !== 1) return;

    if (!isHandHidden && !evolveMode) {
        for (let i = playerHand.length - 1; i >= 0; i--) {
            let c = playerHand[i];
            if (mx >= c.x && mx <= c.x + CARD_W && my >= c.y && my <= c.y + CARD_H) {
                if (playerPP >= c.cost) { draggedCard = { card: c, index: i, type: 'HAND' }; dragOffset.x = mx - c.x; dragOffset.y = my - c.y; return; }
            }
        }
    }

    for (let i = 0; i < playerBoard.length; i++) {
        let c = playerBoard[i];
        if (mx >= c.x && mx <= c.x + CARD_W && my >= c.y && my <= c.y + CARD_H) {
            if (evolveMode && !c.isEvolved && c.type === 'FOLLOWER') {
                playerEP--; c.isEvolved = true; c.atk += 2; c.hp += 2; c.maxHp += 2; c.baseAtk += 2; c.baseHp += 2;
                c.ready = true; c.rushThisTurn = true; evolveMode = false; playEvolveSound(); showPopup('進化！', '#ffeb3b'); return;
            }
            if (c.ready && c.attacksLeft > 0 && !evolveMode && c.type === 'FOLLOWER') { activeAttacker = { card: c, index: i }; return; }
        }
    }
    if (mx >= 650 && mx <= 780 && my >= 375 && my <= 425 && !evolveMode) endTurn();
}

function handleInputMove(e) {
    if (e.cancelable) e.preventDefault(); const pos = getPointerPos(e); mousePos.x = pos.x; mousePos.y = pos.y;
    if (draggedCard) { draggedCard.card.x = mousePos.x - dragOffset.x; draggedCard.card.y = mousePos.y - dragOffset.y; }
}

function handleInputEnd(e) {
    if (e.cancelable) e.preventDefault(); if (gameState !== 'BATTLE') return; if (!draggedCard && !activeAttacker) return;
    const pos = getPointerPos(e); const mx = pos.x; const my = pos.y;

    if (draggedCard && draggedCard.type === 'HAND') {
        let c = draggedCard.card;
        
        if (requiresTarget(c)) {
            let targetEnemy = enemyBoard.find(enemy => mx >= enemy.x && mx <= enemy.x + CARD_W && my >= enemy.y && my <= enemy.y + CARD_H);
            if (targetEnemy || my < 350) { 
                playerPP -= c.cost; playerHand.splice(draggedCard.index, 1); cardsPlayedThisTurn++;
                if (c.type === 'FOLLOWER' || c.type === 'AMULET') { 
                    if (c.ability.includes('STORM')) { c.ready = true; c.attacksLeft = 1; } else if (c.ability.includes('RUSH')) { c.ready = true; c.rushThisTurn = true; c.attacksLeft = 1; } else { c.ready = false; c.attacksLeft = c.ability.includes('TWICE_ATTACK') ? 2 : 1; }
                    playerBoard.push(c); playSummonSound(); updateAuras();
                }
                executeAbility(c, true, targetEnemy);
            }
        } 
        else if (my < 620) { 
            if ((c.type === 'FOLLOWER' || c.type === 'AMULET') && playerBoard.length < 5) {
                playerPP -= c.cost; playerHand.splice(draggedCard.index, 1); cardsPlayedThisTurn++;
                if (c.ability.includes('STORM')) { c.ready = true; c.attacksLeft = 1; } else if (c.ability.includes('RUSH')) { c.ready = true; c.rushThisTurn = true; c.attacksLeft = 1; } else { c.ready = false; c.attacksLeft = c.ability.includes('TWICE_ATTACK') ? 2 : 1; }
                playerBoard.push(c); playSummonSound(); updateAuras(); executeAbility(c, true);
            } 
            else if (c.type === 'SPELL') { playerPP -= c.cost; playerHand.splice(draggedCard.index, 1); cardsPlayedThisTurn++; executeAbility(c, true); }
        }
        draggedCard = null;
    }

    if (activeAttacker) {
        let hasEnemyWard = enemyBoard.some(c => c.ability.includes('WARD')); let attackSuccess = false;
        for (let i = 0; i < enemyBoard.length; i++) {
            let enemy = enemyBoard[i];
            if (mx >= enemy.x && mx <= enemy.x + CARD_W && my >= enemy.y && my <= enemy.y + CARD_H && enemy.type === 'FOLLOWER') {
                if (hasEnemyWard && !enemy.ability.includes('WARD') && !enemy.ability.includes('INVINCIBLE')) { playErrorSound(); showPopup("【守護】を攻撃してください！", '#ff0000'); activeAttacker = null; return; }
                
                if (activeAttacker.card.ability.includes('ATTACK_KILL') && !enemy.ability.includes('INVINCIBLE')) enemy.hp = 0; 
                else if (!enemy.ability.includes('INVINCIBLE')) enemy.hp -= activeAttacker.card.atk; 
                if (!activeAttacker.card.ability.includes('INVINCIBLE')) activeAttacker.card.hp -= enemy.atk; 
                
                attackSuccess = true; break;
            }
        }
        if (!attackSuccess && my < 350 && !activeAttacker.card.rushThisTurn) { 
            if (hasEnemyWard) { playErrorSound(); showPopup("敵の【守護】が邪魔で顔面を狙えない！", '#ff0000'); activeAttacker = null; return; }
            enemyHP -= activeAttacker.card.atk; attackSuccess = true; showPopup("ダイレクトアタック！！", '#ffaa00');
        } else if (!attackSuccess && my < 350 && activeAttacker.card.rushThisTurn) {
            playErrorSound(); showPopup("突進はリーダーを攻撃できない！", '#f00'); activeAttacker = null; return;
        }
        
        if (attackSuccess) {
            playAttackSound(); playDamageSound();
            if (activeAttacker.card.ability.includes('ATTACK_LEADER_DMG_1')) playerHP -= 1;
            if (activeAttacker.card.ability.includes('HEAL_FULL_ON_KILL')) activeAttacker.card.hp = activeAttacker.card.maxHp;
            activeAttacker.card.attacksLeft--; if (activeAttacker.card.attacksLeft <= 0) activeAttacker.card.ready = false;
        }
        checkDeath(); activeAttacker = null;
    }
    checkWinLoss();
}

canvas.addEventListener('mousedown', handleInputStart); canvas.addEventListener('touchstart', handleInputStart, {passive: false});
canvas.addEventListener('mousemove', handleInputMove); canvas.addEventListener('touchmove', handleInputMove, {passive: false});
canvas.addEventListener('mouseup', handleInputEnd); canvas.addEventListener('touchend', handleInputEnd, {passive: false});

function processTurnEndEffects(isPlayer) {
    try {
        let board = isPlayer ? playerBoard : enemyBoard;
        board.forEach(c => {
            let abStr = c.ability.join(',');
            if (abStr.includes('TURN_END_HEAL_LEADER_4')) { if (isPlayer) playerHP = Math.min(20, playerHP + 4); else enemyHP = Math.min(20, enemyHP + 4); showPopup(`ターン終了回復`, '#fbc02d'); }
            if (abStr.includes('TURN_END_HEAL_FULL')) { c.hp = c.maxHp; }
            if (abStr.includes('TURN_END_SUMMON_DRAGON')) { if(board.length < 5) board.push(createCard(TOKENS.DRAGON_5_5)); }
        });
        board.forEach(c => { c.rushThisTurn = false; }); 
    } catch(e) {}
}

function endTurn() {
    if (turn !== 1) return; processTurnEndEffects(true); turn = 2; showPopup("相手のターン", '#aaa');
    if (enemyMaxPP < 10) enemyMaxPP++; enemyPP = enemyMaxPP;
    enemyBoard.forEach(c => { if(c.type==='FOLLOWER'){ c.ready = true; c.attacksLeft = c.ability.includes('TWICE_ATTACK') ? 2 : 1; }});
    cardsPlayedThisTurn = 0; processTurnStartCountdown(false); drawCardToHand(false, 1);
    
    // AIターンの堅牢な制御（エラーが起きても確実にターンが戻るよう遅延実行）
    setTimeout(() => {
        try { enemyAIAction(); } catch(e) { console.error(e); }
        setTimeout(() => {
            try {
                checkWinLoss(); if(gameState !== 'BATTLE') return; processTurnEndEffects(false);
                if (playerMaxPP < 10) playerMaxPP++; playerPP = playerMaxPP;
                playerBoard.forEach(c => { if(c.type==='FOLLOWER'){ c.ready = true; c.attacksLeft = c.ability.includes('TWICE_ATTACK') ? 2 : 1; }});
                cardsPlayedThisTurn = 0; processTurnStartCountdown(true); drawCardToHand(true, 1); 
                turn = 1; globalTurn++; showPopup("あなたのターン！", '#00f2fe'); isHandHidden = false; 
            } catch(e) { console.error("Turn End Recovery", e); turn = 1; }
        }, 1500);
    }, 500);
}

function enemyAIAction() {
    let sortedHand = enemyHand.slice().sort((a,b) => a.cost - b.cost);
    for (let i = 0; i < sortedHand.length; i++) {
        let c = sortedHand[i]; let handIdx = enemyHand.indexOf(c); if (handIdx === -1) continue;
        if (enemyPP >= c.cost) {
            let target = null;
            if (requiresTarget(c)) {
                let validTargets = playerBoard.filter(t => !t.ability.includes('INVINCIBLE') && t.type==='FOLLOWER');
                if (validTargets.length > 0) target = validTargets[Math.floor(Math.random() * validTargets.length)];
                else target = null;
            }
            if (c.type === 'SPELL') {
                enemyPP -= c.cost; enemyHand.splice(handIdx, 1); cardsPlayedThisTurn++; executeAbility(c, false, target); 
            } 
            else if ((c.type === 'FOLLOWER' || c.type === 'AMULET') && enemyBoard.length < 5) {
                enemyPP -= c.cost; enemyHand.splice(handIdx, 1); cardsPlayedThisTurn++;
                if (c.type==='FOLLOWER') {
                    if (c.ability.includes('STORM')) { c.ready = true; c.attacksLeft = 1; } else if (c.ability.includes('RUSH')) { c.ready = true; c.rushThisTurn = true; c.attacksLeft = 1; } else { c.ready = false; c.attacksLeft = c.ability.includes('TWICE_ATTACK') ? 2 : 1; }
                }
                enemyBoard.push(c); playSummonSound(); updateAuras(); executeAbility(c, false, target);
            }
        }
    }

    setTimeout(() => {
        if(gameState !== 'BATTLE') return;
        if (enemyEP > 0 && globalTurn >= 8) {
            let unevolved = enemyBoard.filter(c => c.type==='FOLLOWER' && !c.isEvolved);
            if (unevolved.length > 0) {
                let c = unevolved[0]; enemyEP--; c.isEvolved = true; c.atk += 2; c.hp += 2; c.maxHp += 2; c.baseAtk += 2; c.baseHp += 2;
                c.ready = true; c.rushThisTurn = true; playEvolveSound(); showPopup('敵が進化！', '#ffeb3b');
            }
        }
        enemyBoard.forEach(enemyFighter => {
            if (!enemyFighter.ready || enemyFighter.hp <= 0 || enemyFighter.type !== 'FOLLOWER') return;
            let attacks = enemyFighter.attacksLeft;
            for (let a = 0; a < attacks; a++) {
                if (enemyFighter.hp <= 0) break;
                let target = null; let playerWards = playerBoard.filter(c => c.ability.includes('WARD') && !c.ability.includes('INVINCIBLE'));

                if (playerWards.length > 0) target = playerWards.find(w => enemyFighter.atk >= w.hp) || playerWards[0];
                else {
                    let bestTrade = null; let bestScore = -100;
                    playerBoard.forEach(pf => {
                        if (pf.type !== 'FOLLOWER' || pf.ability.includes('INVINCIBLE')) return;
                        let canKill = (enemyFighter.atk >= pf.hp || enemyFighter.ability.includes('ATTACK_KILL')); 
                        let willDie = (enemyFighter.hp <= pf.atk || pf.ability.includes('ATTACK_KILL'));
                        let score = 0;
                        if (canKill && !willDie) score = 50 + pf.atk * 10;
                        else if (canKill && willDie) score = (pf.atk >= enemyFighter.atk || pf.cost >= enemyFighter.cost) ? 20 + pf.atk * 5 : -10;
                        else if (!canKill && willDie) score = -50; 
                        if (score > bestScore && score > 0) { bestScore = score; bestTrade = pf; }
                    });
                    if (enemyFighter.atk >= playerHP && !enemyFighter.rushThisTurn) target = null; else if (bestTrade) target = bestTrade; else if (enemyFighter.rushThisTurn) target = null;
                }

                if (target) {
                    if (enemyFighter.ability.includes('ATTACK_KILL')) target.hp = 0; else target.hp -= enemyFighter.atk; 
                    if (!enemyFighter.ability.includes('INVINCIBLE')) enemyFighter.hp -= target.atk;
                } else if (!enemyFighter.rushThisTurn) { playerHP -= enemyFighter.atk; } else { break; }
                
                playAttackSound(); playDamageSound();
                enemyFighter.attacksLeft--; if (enemyFighter.attacksLeft <= 0) enemyFighter.ready = false;
                checkDeath(); if (playerHP <= 0) break;
            }
        });
    }, 500);
}

function checkWinLoss() {
    if (playerHP <= 0 || enemyHP <= 0) {
        gameState = 'GAMEOVER'; 
        if (playerHP <= 0) winMessage = 'YOU LOSE...'; else { winMessage = 'YOU WIN!!'; playerGold += 100; showPopup("100 G獲得！", '#ffd700'); }
    }
}

function updateCardPositions() {
    try {
        let phLen = playerHand.length;
        playerHand.forEach((c, idx) => {
            if (draggedCard && draggedCard.card === c) return; 
            let offset = idx - (phLen - 1) / 2;
            c.targetX = (canvas.width / 2 - CARD_W / 2) + offset * 80; c.targetY = isHandHidden ? 900 : (630 + Math.abs(offset) * 8); 
            c.x += (c.targetX - c.x) * 0.15; c.y += (c.targetY - c.y) * 0.15; 
        });

        let ehLen = enemyHand.length;
        enemyHand.forEach((c, idx) => {
            let offset = idx - (ehLen - 1) / 2;
            c.targetX = (canvas.width / 2 - CARD_W / 2) + offset * 60; c.targetY = turn === 1 ? -150 : -50 + Math.abs(offset) * 5; 
            c.x += (c.targetX - c.x) * 0.15; c.y += (c.targetY - c.y) * 0.15;
        });

        let pbLen = playerBoard.length;
        playerBoard.forEach((c, idx) => {
            let offset = idx - (pbLen - 1) / 2;
            c.targetX = (canvas.width / 2 - CARD_W / 2) + offset * (CARD_W + 15); c.targetY = 450;
            c.x += (c.targetX - c.x) * 0.2; c.y += (c.targetY - c.y) * 0.2;
        });

        let ebLen = enemyBoard.length;
        enemyBoard.forEach((c, idx) => {
            let offset = idx - (ebLen - 1) / 2;
            c.targetX = (canvas.width / 2 - CARD_W / 2) + offset * (CARD_W + 15); c.targetY = 250;
            c.x += (c.targetX - c.x) * 0.2; c.y += (c.targetY - c.y) * 0.2;
        });
    } catch(e) {}
}

function drawCard(c, isEnemy = false, isPlayable = false) {
    try {
        ctx.save();
        if (c.ready && c.attacksLeft > 0 && !isEnemy && playerBoard.includes(c) && c.type==='FOLLOWER' && !evolveMode) { ctx.shadowBlur = 15; ctx.shadowColor = '#00f2fe'; } 
        else if (isPlayable && c.type !== 'ENEMY_HAND' && !isHandHidden) { ctx.shadowBlur = 10; ctx.shadowColor = '#00ff66'; } 
        else if (evolveMode && !isEnemy && playerBoard.includes(c) && !c.isEvolved && c.type==='FOLLOWER') { ctx.shadowBlur = 20; ctx.shadowColor = '#ffeb3b'; }
        else { ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(0,0,0,0.6)'; }
        
        ctx.fillStyle = c.color || '#333'; ctx.fillRect(c.x, c.y, CARD_W, CARD_H);
        ctx.lineWidth = 3;
        if (c.type === 'ENEMY_HAND') ctx.strokeStyle = '#555';
        else if (c.isEvolved) { ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 4; }
        else if (c.type === 'AMULET') { ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = 4; }
        else if (c.ability.includes('WARD')) { ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 5; }
        else if (c.ability.includes('INVINCIBLE')) { ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 5; }
        else if (c.type === 'SPELL') ctx.strokeStyle = '#9c27b0'; else ctx.strokeStyle = '#222';
        
        ctx.strokeRect(c.x, c.y, CARD_W, CARD_H); ctx.restore();

        if (c.type === 'ENEMY_HAND') { ctx.fillStyle = '#111'; ctx.fillRect(c.x+5, c.y+5, CARD_W-10, CARD_H-10); return; }

        ctx.fillStyle = c.textColor || '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(c.name || '???', c.x + CARD_W/2, c.y + 25);
        ctx.font = '9px sans-serif'; const lines = (c.desc || '').split('\n'); lines.forEach((line, i) => ctx.fillText(line, c.x + CARD_W/2, c.y + 45 + (i * 12)));

        ctx.fillStyle = '#0055ff'; ctx.beginPath(); ctx.arc(c.x + 14, c.y + 14, 12, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.fillText(c.cost || 0, c.x + 14, c.y + 19);

        if (c.countdown > 0) {
            ctx.fillStyle = '#ffeb3b'; ctx.beginPath(); ctx.arc(c.x + CARD_W/2, c.y + CARD_H/2 + 20, 15, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.font = 'bold 16px sans-serif'; ctx.fillText(c.countdown, c.x + CARD_W/2, c.y + CARD_H/2 + 25);
        }

        if (c.type === 'FOLLOWER') {
            ctx.fillStyle = '#ffaa00'; ctx.beginPath(); ctx.arc(c.x + 14, c.y + CARD_H - 14, 12, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = (c.atk > c.baseAtk) ? '#00ff00' : (c.atk < c.baseAtk ? '#ff3333' : '#fff'); ctx.fillText(c.atk || 0, c.x + 14, c.y + CARD_H - 9);
            ctx.fillStyle = '#ff2255'; ctx.beginPath(); ctx.arc(c.x + CARD_W - 14, c.y + CARD_H - 14, 12, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = (c.hp < c.maxHp) ? '#ff9999' : (c.hp > c.baseHp ? '#00ff00' : '#fff'); ctx.fillText(c.hp || 0, c.x + CARD_W - 14, c.y + CARD_H - 9);
        }
    } catch(e) {}
}

function drawMainMenu() {
    ctx.fillStyle = '#0b0c16'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 50px sans-serif'; ctx.textAlign = 'center'; ctx.shadowBlur = 20; ctx.shadowColor = '#00f2fe';
    ctx.fillText('SHADOW BATTLES', canvas.width/2, 150); ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffd700'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'right'; ctx.fillText(`所持金: ${playerGold} G`, canvas.width - 20, 40);

    const modes = [
        { y: 250, label: '通常対戦', color: '#1e88e5', desc: '好きなデッキを選んでAIと戦う' },
        { y: 400, label: 'ドラフト対戦', color: '#8e24aa', desc: 'PRIZE GET! 3択から選んで即席デッキ構築！' },
        { y: 550, label: 'ボス討伐戦', color: '#d32f2f', desc: '超絶HPの「黒き甲冑の暗黒卿」に挑む！' }
    ];

    modes.forEach(m => {
        ctx.fillStyle = m.color; ctx.fillRect(200, m.y, 400, 100); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.strokeRect(200, m.y, 400, 100);
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 30px sans-serif'; ctx.fillText(m.label, 400, m.y + 45);
        ctx.font = '14px sans-serif'; ctx.fillText(m.desc, 400, m.y + 80);
    });
}

function drawSelectScreen() {
    ctx.fillStyle = '#0b0c16'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('使用するデッキを選択してください', canvas.width/2, 100);

    const keys = Object.keys(DECKS);
    keys.forEach((key, idx) => {
        let dx = 70 + (idx % 2) * 340; let dy = 160 + Math.floor(idx / 2) * 150; let info = DECK_INFO[key];
        ctx.fillStyle = info.color; ctx.fillRect(dx, dy, 310, 110); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(dx, dy, 310, 110);
        ctx.fillStyle = getTextColor(info.color); ctx.font = 'bold 20px sans-serif'; ctx.fillText(info.name, dx + 155, dy + 40);
        ctx.font = '12px sans-serif'; ctx.fillText(info.desc, dx + 155, dy + 75);
    });
}

function drawDraftScreen() {
    ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff007f'; ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center'; ctx.shadowBlur = 10; ctx.shadowColor = '#fff';
    ctx.fillText('PRIZE GET! カードを選択！', canvas.width/2, 100); ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = '20px sans-serif'; ctx.fillText(`Drafting: ${draftCount} / 40`, canvas.width/2, 150);

    for(let i=0; i<3; i++) {
        let c = draftOptions[i]; let dx = 150 + i * 180; let dy = 350;
        ctx.fillStyle = c.color || '#333'; ctx.fillRect(dx, dy, 160, 230); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.strokeRect(dx, dy, 160, 230);
        ctx.fillStyle = c.textColor; ctx.font = 'bold 16px sans-serif'; ctx.fillText(c.name, dx + 80, dy + 40);
        ctx.font = '12px sans-serif'; const lines = (c.desc || '').split('\n'); lines.forEach((line, j) => ctx.fillText(line, dx + 80, dy + 100 + (j * 15)));
        ctx.fillStyle = '#0055ff'; ctx.beginPath(); ctx.arc(dx + 25, dy + 25, 18, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = 'bold 18px sans-serif'; ctx.fillText(c.cost, dx + 25, dy + 32);
        if(c.type === 'FOLLOWER') {
            ctx.fillStyle = '#ffaa00'; ctx.beginPath(); ctx.arc(dx + 25, dy + 205, 18, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillText(c.atk, dx + 25, dy + 212);
            ctx.fillStyle = '#ff2255'; ctx.beginPath(); ctx.arc(dx + 135, dy + 205, 18, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillText(c.hp, dx + 135, dy + 212);
        }
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = playerHP <= 0 ? '#ff3333' : '#00f2fe'; ctx.font = 'bold 60px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(winMessage, canvas.width/2, canvas.height/2 - 50);
    ctx.fillStyle = '#3f51b5'; ctx.fillRect(300, 550, 200, 50); ctx.strokeStyle = '#fff'; ctx.strokeRect(300, 550, 200, 50); ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.fillText('メインメニューへ', 400, 583);
}

function drawBattle() {
    try {
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height); grad.addColorStop(0, '#0a0a1a'); grad.addColorStop(0.5, '#1a1a2e'); grad.addColorStop(1, '#0a0a1a');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 400); ctx.lineTo(canvas.width, 400); ctx.stroke();

        ctx.fillStyle = '#3f51b5'; ctx.beginPath(); ctx.arc(400, 90, 50, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`ENEMY: ${enemyHP}`, 400, 95);
        ctx.fillStyle = '#e91e63'; ctx.beginPath(); ctx.arc(400, 710, 50, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#fff'; ctx.fillText(`YOU: ${playerHP}`, 400, 715);

        ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#00f2fe'; ctx.fillText(`PP: ${playerPP} / ${playerMaxPP}`, 30, 740);
        ctx.fillStyle = '#ffeb3b'; ctx.fillText(`EP: ${playerEP} / ${playerMaxEP}`, 30, 770);
        ctx.fillStyle = '#ff0055'; ctx.fillText(`敵PP: ${enemyPP} / ${enemyMaxPP}`, 30, 60);
        ctx.fillStyle = '#ffeb3b'; ctx.fillText(`敵EP: ${enemyEP} / ${enemyMaxEP}`, 30, 90);

        ctx.fillStyle = turn === 1 ? '#00f2fe' : '#333'; ctx.fillRect(650, 375, 130, 50); ctx.strokeStyle = '#fff'; ctx.strokeRect(650, 375, 130, 50);
        ctx.fillStyle = turn === 1 ? '#000' : '#888'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(turn === 1 ? 'ターン終了' : '相手のターン', 715, 405);
        
        ctx.fillStyle = isHandHidden ? '#4caf50' : '#d32f2f'; ctx.fillRect(680, 650, 100, 50); ctx.strokeStyle = '#fff'; ctx.strokeRect(680, 650, 100, 50);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.fillText(isHandHidden ? '手札を出す' : '手札を隠す', 730, 680);

        if (turn === 1 && playerEP > 0 && globalTurn >= 9) {
            ctx.fillStyle = evolveMode ? '#ffeb3b' : '#333'; ctx.fillRect(10, 550, 100, 50); ctx.strokeStyle = '#ffeb3b'; ctx.strokeRect(10, 550, 100, 50);
            ctx.fillStyle = evolveMode ? '#000' : '#ffeb3b'; ctx.fillText(`進化(EP:${playerEP})`, 60, 580);
        }

        updateCardPositions();
        enemyBoard.forEach(c => drawCard(c, true)); playerBoard.forEach(c => drawCard(c, false));
        enemyHand.forEach(c => drawCard({ ...c, type: 'ENEMY_HAND' }, true)); playerHand.forEach(c => drawCard(c, false, playerPP >= c.cost)); 

        if (draggedCard) drawCard(draggedCard.card, false, true);

        if (activeAttacker) {
            ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 6; ctx.setLineDash([10, 10]); ctx.beginPath(); ctx.moveTo(activeAttacker.card.x + CARD_W/2, activeAttacker.card.y + CARD_H/2);
            ctx.lineTo(mousePos.x, mousePos.y); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = '#ff0055'; ctx.beginPath(); ctx.arc(mousePos.x, mousePos.y, 10, 0, Math.PI*2); ctx.fill();
        }

        for (let i = popups.length - 1; i >= 0; i--) {
            let p = popups[i]; ctx.fillStyle = p.color; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center'; ctx.shadowBlur = 10; ctx.shadowColor = '#000'; ctx.fillText(p.text, 400, p.y);
            p.y -= 1; p.timer--; ctx.shadowBlur = 0; if (p.timer <= 0) popups.splice(i, 1);
        }
    } catch(e) {}
}

function draw() {
    if (gameState === 'MAIN_MENU') drawMainMenu();
    else if (gameState === 'SELECT') drawSelectScreen();
    else if (gameState === 'DRAFT') drawDraftScreen();
    else if (gameState === 'BATTLE') drawBattle();
    else if (gameState === 'GAMEOVER') { drawBattle(); drawGameOver(); }
}

function gameLoop() { draw(); requestAnimationFrame(gameLoop); } gameLoop();
</script>
