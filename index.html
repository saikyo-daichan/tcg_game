        ctx.fillStyle = 'rgba(10,0,0,0.9)'; ctx.fillRect(0, 0, cvs.width, cvs.height);

const ALL_CARDS = [];
Object.keys(DECKS).forEach(k => {
    ALL_CARDS.push(...DECKS[k].BASE);
    DECK_INFO[k].archetypes.forEach(a => {
        ALL_CARDS.push(...DECKS[k][a.id]);
    });
});
ALL_CARDS.push(...NEUTRAL);

// ==========================================
// カード生成・デッキ構築
// ==========================================
function createCard(base) {
    let isAmulet = (base.type === 'AMULET');
    let hp = base.hp || (isAmulet ? 1 : 0); 
    let atk = base.atk || 0; 
    let cd = base.countdown !== undefined ? base.countdown : -1;
    return { 
        name: base.name, type: base.type, cost: base.cost, atk: atk, hp: hp, maxHp: hp, color: base.color,
        id: Math.random(), ready: false, rushThisTurn: false, attacksLeft: 1, baseAtk: atk, baseHp: hp,
        ability: base.ability ? [...base.ability] : [], countdown: cd,
        textColor: getTextColor(base.color), desc: base.desc || '', 
        isEvolved: false, evolveTimer: 0, attackAnimTimer: 0, attackTargetX: 0, attackTargetY: 0,
        x: 400, y: 800, targetX: 400, targetY: 800 
    };
}

function buildDeck(classKey, archKey) {
    let deck = [];
    let pool = [...DECKS[classKey].BASE, ...DECKS[classKey][archKey], ...NEUTRAL];
    pool.sort(() => Math.random() - 0.5);
    for(let i = 0; i < 40; i++) {
        deck.push(createCard(pool[i % pool.length]));
    }
    return deck.sort(() => Math.random() - 0.5);
}

function drawCardToHand(isPlayer, amount = 1) {
    try { 
        let hand = isPlayer ? playerHand : enemyHand; 
        let deck = isPlayer ? playerDeck : enemyDeck;
        for(let i = 0; i < amount; i++) { 
            if (deck.length > 0 && hand.length < 9) {
                hand.push(deck.pop()); 
            } else if (deck.length <= 0) {
                if (isPlayer) playerHP = 0; else enemyHP = 0;
                addBattleLog(`${isPlayer ? 'あなた' : '相手'} のデッキが尽きた！`, isPlayer);
            }
        }
    } catch(e) {}
}

function checkNecroDeck(deckArr) {
    return deckArr.some(c => c.ability.some(a => 
        a.includes('NECRO') || a.includes('SUMMON_SKELETON') || a.includes('SUMMON_ZOMBIE')
    ));
}

// ==========================================
// ゲーム開始・初期化処理
// ==========================================
function initGame(mode, pClass = 'ROYAL', pArch = 'AGGRO') {
    gameMode = mode;
    if (mode === 'NORMAL' || mode === 'BOSS') {
        playerDeckClass = pClass; playerDeckArchetype = pArch;
        playerDeck = buildDeck(pClass, pArch); playerHasNecro = checkNecroDeck(playerDeck);
        
        if (mode === 'BOSS') {
            enemyDeckClass = 'BOSS'; enemyDeckArchetype = 'BOSS'; enemyDeck = [];
            let bPool = BOSS_DECKS[bossLevel];
            for (let i = 0; i < 40; i++) { enemyDeck.push(createCard(bPool[Math.floor(Math.random() * bPool.length)])); }
            enemyHasNecro = false;
        } else {
            const keys = Object.keys(DECKS); 
            enemyDeckClass = keys[Math.floor(Math.random() * keys.length)];
            const archs = DECK_INFO[enemyDeckClass].archetypes;
            enemyDeckArchetype = archs[Math.floor(Math.random() * archs.length)].id;
            enemyDeck = buildDeck(enemyDeckClass, enemyDeckArchetype);
            enemyHasNecro = checkNecroDeck(enemyDeck);
        }
        enemySleeveColor = Math.floor(Math.random() * 3);
        startCoinToss();
    } else if (mode === 'DRAFT') {
        gameState = 'DRAFT'; playerDeck = []; draftCount = 0; generateDraftOptions();
    }
}

function generateDraftOptions() {
    draftOptions = [];
    for (let i = 0; i < 3; i++) { draftOptions.push(createCard(ALL_CARDS[Math.floor(Math.random() * ALL_CARDS.length)])); }
}

function startCoinToss() {
    gameState = 'COIN_TOSS'; coinTossState = 0; coinTossTimer = 120; 
    isPlayerFirst = Math.random() < 0.5; playTone(1000, 'triangle', 0.5);
}

function startGameAfterToss() {
    turn = isPlayerFirst ? 1 : 2; globalTurn = 1;
    let bHP = bossLevel === 1 ? 25 : (bossLevel === 2 ? 50 : 100);
    pMaxHP = 20; eMaxHP = gameMode === 'BOSS' ? bHP : 20;
    playerHP = pMaxHP; enemyHP = eMaxHP;
    playerMaxPP = 0; enemyMaxPP = 0;

    if (isPlayerFirst) { playerMaxPP = 1; playerPP = 1; } 
    else { enemyMaxPP = 1; enemyPP = 1; }
    
    playerMaxEP = isPlayerFirst ? 2 : 3; enemyMaxEP = isPlayerFirst ? 3 : 2;
    playerEP = playerMaxEP; enemyEP = enemyMaxEP; 
    playerGrave = 0; enemyGrave = 0; cardsPlayedThisTurn = 0; 
    evolveMode = false; hasEvolvedThisTurn = false;
    p1EvolvedNotified = false; p2EvolvedNotified = false;
    
    playerHand = []; playerBoard = []; enemyHand = []; enemyBoard = []; 
    playedCardsLog = []; particles = []; battleLog = [];
    draggedCard = null; activeAttacker = null; isHandHidden = false; popups = [];
    showBattleLog = false; zoomedCard = null;

    if (gameMode === 'DRAFT') {
        enemyDeck = []; 
        for (let i = 0; i < 40; i++) { enemyDeck.push(createCard(ALL_CARDS[Math.floor(Math.random() * ALL_CARDS.length)])); }
        enemyHasNecro = checkNecroDeck(enemyDeck); enemySleeveColor = Math.floor(Math.random() * 3);
    }

    drawCardToHand(true, isPlayerFirst ? 3 : 4); drawCardToHand(false, isPlayerFirst ? 4 : 3);

    gameState = 'BATTLE'; playMenuSound();
    
    let archName = (gameMode === 'NORMAL') ? DECK_INFO[playerDeckClass].archetypes.find(a => a.id === playerDeckArchetype).name : "ドラフトデッキ";
    showPopup(isPlayerFirst ? "先攻！BATTLE START!!" : "後攻！BATTLE START!!", '#fff');
    addBattleLog(`【${archName}】でバトル開始！`, null);

    if (!isPlayerFirst) { isAITurn = true; setTimeout(enemyAITask, 1000); } 
    else { isAITurn = false; }
}

function updateAuras() {
    let pAuraAtk = 0, pAuraHp = 0, eAuraAtk = 0, eAuraHp = 0; 
    let pHasAFRush = false, eHasAFRush = false;
    
    playerBoard.forEach(c => { 
        if (c.type === 'AMULET') {
            if (c.ability.includes('AURA_ATK_1')) pAuraAtk += 1; 
            if (c.ability.includes('AURA_DEF_2')) pAuraHp += 2; 
            if (c.ability.includes('AURA_RUSH_TO_AF')) pHasAFRush = true;
        }
    });
    enemyBoard.forEach(c => { 
        if (c.type === 'AMULET') {
            if (c.ability.includes('AURA_ATK_1')) eAuraAtk += 1; 
            if (c.ability.includes('AURA_DEF_2')) eAuraHp += 2; 
            if (c.ability.includes('AURA_RUSH_TO_AF')) eHasAFRush = true;
        }
    });

    playerBoard.forEach(c => { 
        if (c.type === 'FOLLOWER') { 
            c.atk = c.baseAtk + pAuraAtk; let newMax = c.baseHp + pAuraHp;
            if (newMax > c.maxHp) { c.hp += (newMax - c.maxHp); }
            c.maxHp = newMax; if (c.hp > c.maxHp) c.hp = c.maxHp; 
            if (pHasAFRush && (c.name === 'AF' || c.name === 'アーティファクト') && c.attacksLeft > 0 && !c.ability.includes('STORM') && !c.ready) { 
                c.ready = true; c.rushThisTurn = true; 
            }
        }
    });
    enemyBoard.forEach(c => { 
        if (c.type === 'FOLLOWER') { 
            c.atk = c.baseAtk + eAuraAtk; let newMax = c.baseHp + eAuraHp;
            if (newMax > c.maxHp) { c.hp += (newMax - c.maxHp); }
            c.maxHp = newMax; if (c.hp > c.maxHp) c.hp = c.maxHp; 
            if (eHasAFRush && (c.name === 'AF' || c.name === 'アーティファクト') && c.attacksLeft > 0 && !c.ability.includes('STORM') && !c.ready) { 
                c.ready = true; c.rushThisTurn = true; 
            }
        }
    });
}

function triggerCountdownTick(c, isPlayer, myBoard) {
    c.ability.forEach(ab => {
        let mHeal = ab.match(/CD_TICK_HEAL_LEADER_(\d+)/);
        if (mHeal) { 
            let v = parseInt(mHeal[1]); 
            if(isPlayer) playerHP = Math.min(pMaxHP, playerHP + v); 
            else enemyHP = Math.min(eMaxHP, enemyHP + v); 
            playHealSound(); showPopup(`進行: ${v}回復！`, '#fbc02d'); 
        }
        if (ab === 'CD_TICK_DRAW_1') { drawCardToHand(isPlayer, 1); playSpellSound(); showPopup('進行: 1ドロー', '#1976d2'); }
        if (ab === 'CD_TICK_SUMMON_SKELETON') { if(myBoard.length < 5) myBoard.push(createCard(TOKENS.SKELETON)); playSummonSound(); }
        if (ab === 'CD_TICK_FACE_DMG_1') { if(isPlayer) enemyHP -= 1; else playerHP -= 1; playDamageSound(); showPopup('進行: 顔面1ダメ', '#ff5722'); }
        if (ab === 'CD_TICK_FACE_DMG_1_SELF_DMG_1') { if(isPlayer) { enemyHP -= 1; playerHP -= 1; } else { playerHP -= 1; enemyHP -= 1; } playDamageSound(); }
        if (ab === 'CD_TICK_ADD_DECK_ARTIFACT') { let deck = isPlayer ? playerDeck : enemyDeck; deck.push(createCard(TOKENS.ARTIFACT)); playSpellSound(); }
        if (ab === 'CD_TICK_ADD_FAIRY') { let h = isPlayer ? playerHand : enemyHand; if (h.length < 9) h.push(createCard(TOKENS.FAIRY)); playSpellSound(); }
        if (ab === 'CD_TICK_RAMP_1') { 
            if(isPlayer) { playerMaxPP = Math.min(10, playerMaxPP + 1); playerPP++; }
            else { enemyMaxPP = Math.min(10, enemyMaxPP + 1); enemyPP++; } 
            playSpellSound(); 
        }
    });
}

function processTurnStartCountdown(isPlayer) {
    try {
        let board = isPlayer ? playerBoard : enemyBoard;
        board.forEach(c => {
            if (c.type === 'AMULET' && c.countdown > 0) {
                c.countdown--; triggerCountdownTick(c, isPlayer, board);
                if (c.countdown === 0) { c.hp = 0; showPopup('カウントダウン完了！', '#00bfa5'); } 
                else { showPopup(`カウント: ${c.countdown}`, '#00bfa5'); }
            }
        });
        checkDeath();
    } catch(e) { console.error("Countdown Error:", e); }
}

function checkDeath() {
    let deadFound = false;
    let processBoard = (board, isPlayer) => {
        let newBoard = [];
        board.forEach(c => {
            if (c.hp <= 0 && !c.ability.includes('INVINCIBLE')) {
                deadFound = true; addBattleLog(`「${c.name}」が破壊された`, isPlayer);
                if (c.type === 'FOLLOWER') { if(isPlayer) playerGrave++; else enemyGrave++; }
                
                for (let i = 0; i < 15; i++) {
                    particles.push({
                        x: c.x + CARD_W / 2, y: c.y + CARD_H / 2,
                        vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,

                    });
                }

                c.ability.forEach(ab => {

                    if (ab === 'DEATH_SUMMON_SKELETON') if(newBoard.length < 5) newBoard.push(createCard(TOKENS.SKELETON));
                    if (ab === 'DEATH_SUMMON_SKELETON_2') {

                    }
                    if (ab === 'DEATH_SUMMON_2_3_WARD') { if(newBoard.length < 5) newBoard.push(createCard({name:'重装兵',type:'FOLLOWER',cost:3,atk:2,hp:3,maxHp:3,ability:['WARD'],color:'#777'})); }
                    if (ab === 'DEATH_RAMP_1') { if(isPlayer) playerMaxPP = Math.min(10, playerMaxPP + 1); else enemyMaxPP = Math.min(10, enemyMaxPP + 1); }
                    let hm = ab.match(/DEATH_HEAL_LEADER_(\d+)/) || ab.match(/DEATH_HEAL_(\d+)/);
                    if (hm) { 
                        if(isPlayer) playerHP = Math.min(pMaxHP, playerHP + parseInt(hm[1])); 
                        else enemyHP = Math.min(eMaxHP, enemyHP + parseInt(hm[1])); playHealSound(); 
                    }
                    if (ab === 'DEATH_SUMMON_ZOMBIE_2') { 
                        if(newBoard.length < 5) newBoard.push(createCard(TOKENS.ZOMBIE)); 
                        if(newBoard.length < 5) newBoard.push(createCard(TOKENS.ZOMBIE)); 
                    }

                    if (ab === 'DEATH_ADD_DECK_ARTIFACT_2') { 
                        let dk = isPlayer ? playerDeck : enemyDeck; dk.push(createCard(TOKENS.ARTIFACT)); dk.push(createCard(TOKENS.ARTIFACT)); 
                    }
                    if (ab === 'DEATH_ADD_3_FAIRY') { 
                        let h = isPlayer ? playerHand : enemyHand; for(let i = 0; i < 3; i++) { if (h.length < 9) h.push(createCard(TOKENS.FAIRY)); } 
                    }
                    if (ab === 'DEATH_DRAW_2_SELF_DMG_2') { drawCardToHand(isPlayer, 2); if(isPlayer) playerHP -= 2; else enemyHP -= 2; }
                    if (ab === 'DEATH_KILL_RANDOM') {
                        let tb = isPlayer ? enemyBoard : playerBoard; let valid = tb.filter(t => t.type === 'FOLLOWER' && !t.ability.includes('INVINCIBLE'));
                        if (valid.length > 0) valid[Math.floor(Math.random() * valid.length)].hp = 0;
                    }
                    let aoeM = ab.match(/DEATH_AOE_(\d+)/);
                    if (aoeM) { 
                        let d = parseInt(aoeM[1]); let tb = isPlayer ? enemyBoard : playerBoard; 
                        tb.forEach(ec => { if (ec.type === 'FOLLOWER' && !ec.ability.includes('INVINCIBLE')) ec.hp -= d; }); 
                    }
                    if (ab === 'DEATH_SUMMON_MORDECAI') { if(newBoard.length < 5) newBoard.push(createCard(TOKENS.MORDECAI)); }
                    let buffM = ab.match(/DEATH_BUFF_ALL_(\d+)_(\d+)/);
                    if (buffM) { 
                        let a = parseInt(buffM[1]), h = parseInt(buffM[2]); 
                        newBoard.forEach(pc => { if(pc.type === 'FOLLOWER') { pc.atk += a; pc.baseAtk += a; pc.hp += h; pc.maxHp += h; pc.baseHp += h; } }); 
                    }
                });
            } else { newBoard.push(c); }
        });
        return newBoard;
    };

    playerBoard = processBoard(playerBoard, true); 
    enemyBoard = processBoard(enemyBoard, false);

    if (deadFound) { 
        playTone(100, 'sawtooth', 0.2, 0.3); playTone(50, 'square', 0.3, 0.2); updateAuras(); 
        if (playerBoard.some(c => c.hp <= 0 && !c.ability.includes('INVINCIBLE')) || enemyBoard.some(c => c.hp <= 0 && !c.ability.includes('INVINCIBLE'))) {
            checkDeath(); 
        }
    }
}

function getRequiredGrave(c) {
    let req = 0;
    c.ability.forEach(a => { 
        if (a.includes('NECRO_2_')) req = 2; 
        if (a.includes('NECRO_4_')) req = 4; 
        if (a.includes('NECRO_6_')) req = 6; 
    });
    return req;
}

function playCardFromHand(dragObj, targetEnemy, targetFace, isPlayer) {
    let c = dragObj.card; let index = dragObj.index;
    let myHand = isPlayer ? playerHand : enemyHand; 
    let myBoard = isPlayer ? playerBoard : enemyBoard; 
    let myGrave = isPlayer ? playerGrave : enemyGrave;

    let reqGrave = getRequiredGrave(c);
    if (reqGrave > 0 && myGrave < reqGrave) { if(isPlayer) playErrorSound(); }

    if (isPlayer) playerPP -= c.cost; else enemyPP -= c.cost;
    myHand.splice(index, 1); cardsPlayedThisTurn++;
    addBattleLog(`${isPlayer ? 'あなた' : '相手'}が「${c.name}」をプレイ`, isPlayer);

    if (c.ability.includes('SPELLBOOST_ALL')) {
        myHand.forEach(hc => { if (hc.ability.includes('SPELLBOOST_COST_DOWN')) { hc.cost = Math.max(0, hc.cost - 1); } });
        showPopup("スペルブースト！", "#0d47a1");
    }

    if (c.type === 'FOLLOWER' || c.type === 'AMULET') {
        c.ready = c.ability.includes('STORM') || c.ability.includes('RUSH');
        if (c.ability.includes('VENGEANCE_STORM') && (isPlayer ? playerHP : enemyHP) <= 10) { c.ready = true; }
        if (c.ability.includes('AWAKENING_STORM') && (isPlayer ? playerMaxPP : enemyMaxPP) >= 7) { c.ready = true; }

        c.rushThisTurn = c.ability.includes('RUSH') && !c.ready; 
        c.attacksLeft = c.ability.includes('TWICE_ATTACK') ? 2 : 1;
        myBoard.push(c); playSummonSound(); updateAuras();
    } else { playSpellSound(); }
    
    executeAbility(c, isPlayer, targetEnemy, targetFace);
    return true;
}

                myBoard.forEach(c => { if(c.type === 'FOLLOWER') { c.atk += 2; c.baseAtk += 2; c.hp += 2; c.maxHp += 2; c.baseHp += 2; } }); showPopup(`ネクロ(4):全体+2/+2！`, '#aa00ff');
            }
            else if (ab.includes('NECRO_6_BUFF_5_5')) {
                if (isPlayer && playerGrave >= 6) { playerGrave -= 6; } else if (!isPlayer && enemyGrave >= 6) { enemyGrave -= 6; } else { return; }
                card.atk += 5; card.hp += 5; card.maxHp += 5; card.baseAtk += 5; card.baseHp += 5; showPopup(`タイラント覚醒！`, '#aa00ff');
            }
            else if (ab.includes('NECRO_6_BURN_FACE_')) {
                let m = ab.match(/BURN_FACE_(\d+)/);
                if (m) {
                    if (isPlayer && playerGrave >= 6) { playerGrave -= 6; } else if (!isPlayer && enemyGrave >= 6) { enemyGrave -= 6; } else { return; }
                    let d = parseInt(m[1]); if (isPlayer) enemyHP -= d; else playerHP -= d; playDamageSound(); showPopup(`ネクロ(6):${d}ダメ！`, '#aa00ff');
                }
            }
            
            let healM = ab.match(/HEAL_LEADER_(\d+)/) || ab.match(/FANFARE_HEAL_(\d+)/);
            if (healM && !ab.includes('DEATH') && !ab.includes('TURN_END') && !ab.includes('CD_TICK') && !ab.includes('VENGEANCE') && !ab.includes('AWAKENING')) {
                let h = parseInt(healM[1]);
                if (isPlayer) playerHP = Math.min(pMaxHP, playerHP + h); else enemyHP = Math.min(eMaxHP, enemyHP + h); 
                playHealSound(); showPopup(`顔面${h}回復！`, '#fbc02d');
                myBoard.forEach(bc => {
                    if (bc.ability.includes('HEAL_TRIGGER_BURN_2')) {
                        let valid = targetBoard.filter(t => t.type === 'FOLLOWER' && !t.ability.includes('INVINCIBLE'));
                        if (valid.length > 0) { valid[Math.floor(Math.random() * valid.length)].hp -= 2; } 
                        else { if (isPlayer) enemyHP -= 2; else playerHP -= 2; }
                        playDamageSound(); showPopup("回復トリガー！2ダメ！", "#ffee58");
                    }
                    if (bc.ability.includes('HEAL_TRIGGER_BUFF_1_1')) { bc.atk++; bc.hp++; bc.baseAtk++; bc.baseHp++; bc.maxHp++; }
                    if (bc.ability.includes('HEAL_TRIGGER_FACE_DMG_1')) { if (isPlayer) enemyHP -= 1; else playerHP -= 1; playDamageSound(); }
                });
            }
            
            let healAllM = ab.match(/HEAL_ALL_(\d+)/);
            if (healAllM) {
                let h = parseInt(healAllM[1]); myBoard.forEach(c => { if(c.type === 'FOLLOWER') c.hp = Math.min(c.maxHp, c.hp + h) }); playHealSound(); showPopup(`全体回復！`, '#fbc02d');
            }

            let selfDmgM = ab.match(/SELF_DMG_(\d+)/);
            if (selfDmgM && !ab.includes('DEATH') && !ab.includes('TURN_END') && !ab.includes('ATTACK') && !ab.includes('CD_TICK')) { 
                let d = parseInt(selfDmgM[1]); if (isPlayer) playerHP -= d; else enemyHP -= d; playDamageSound(); showPopup(`自身に${d}ダメ！`, '#b71c1c'); 
            }
            
            let buffM = ab.match(/BUFF_ALL_(\d+)_(\d+)/);
            if (buffM && !ab.includes('DEATH') && !ab.includes('NECRO') && !ab.includes('BOUNCE') && !ab.includes('EARTH_RITE') && !ab.includes('MAGES')) {
                let a = parseInt(buffM[1]), h = parseInt(buffM[2]);
                myBoard.forEach(c => { if(c.type === 'FOLLOWER') { c.atk += a; c.baseAtk += a; c.hp += h; c.maxHp += h; c.baseHp += h; } }); showPopup(`全体強化！`, '#ff9800');
            }

            let aoeM = ab.match(/AOE_(\d+)/);
            if (aoeM && !ab.includes('DEATH') && !ab.includes('CD_TICK') && !ab.includes('AWAKENING') && !ab.includes('NECRO')) {
                let d = parseInt(aoeM[1]); targetBoard.forEach(c => { if(c.type === 'FOLLOWER' && !c.ability.includes('INVINCIBLE')) c.hp -= d; }); playDamageSound(); showPopup(`全体に${d}ダメージ！`, '#1e88e5');
            }
            if (ab === 'AWAKENING_AOE_4' && (isPlayer ? playerMaxPP : enemyMaxPP) >= 7) {
                targetBoard.forEach(c => { if(c.type === 'FOLLOWER' && !c.ability.includes('INVINCIBLE')) c.hp -= 4; }); playDamageSound(); showPopup(`覚醒全体4ダメ！`, '#004d40');
            }
            if (ab === 'AWAKENING_HEAL_3' && (isPlayer ? playerMaxPP : enemyMaxPP) >= 7) {
                if(isPlayer) playerHP = Math.min(pMaxHP, playerHP + 3); else enemyHP = Math.min(eMaxHP, enemyHP + 3); playHealSound(); showPopup(`覚醒3回復！`, '#00897b');
            }
            if (ab === 'NECRO_4_AOE_3') {
                if (isPlayer && playerGrave >= 4) { playerGrave -= 4; targetBoard.forEach(c => { if(c.type === 'FOLLOWER' && !c.ability.includes('INVINCIBLE')) c.hp -= 3; }); playDamageSound(); }
                else if (!isPlayer && enemyGrave >= 4) { enemyGrave -= 4; targetBoard.forEach(c => { if(c.type === 'FOLLOWER' && !c.ability.includes('INVINCIBLE')) c.hp -= 3; }); playDamageSound(); }
            }
            if (ab === 'VENGEANCE_FACE_3' && (isPlayer ? playerHP : enemyHP) <= 10) {
                if (isPlayer) enemyHP -= 3; else playerHP -= 3; playDamageSound(); showPopup("復讐3ダメ！", "#d32f2f");
            }
            
            let faceM = ab.match(/FACE_DMG_(\d+)/) || ab.match(/BURN_FACE_(\d+)/);
            if (faceM && !ab.includes('DEATH') && !ab.includes('TURN_END') && !ab.includes('NECRO') && !ab.includes('CD_TICK') && !ab.includes('SPELLBOOST') && !ab.includes('HEAL') && !ab.includes('VENGEANCE')) {
                let d = parseInt(faceM[1]); if (isPlayer) enemyHP -= d; else playerHP -= d; playDamageSound(); showPopup(`顔面に${d}ダメ！`, '#ff5722');
            }

            if (ab === 'SPELL_COST_DOWN_CUCUMBER_HAND') {
                myHand.forEach(c => { if(c.name.includes('きゅうり')) c.cost = Math.max(0, c.cost-1); }); showPopup(`きゅうりコスト-1！`, '#55aa55');
            }
        });
        updateAuras(); checkDeath();
    } catch(e) {}
}

function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect(); 
    const scaleX = canvas.width / rect.width; 
    const scaleY = canvas.height / rect.height;
    let cx = e.clientX, cy = e.clientY;
    if (e.touches && e.touches.length > 0) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
    else if (e.changedTouches && e.changedTouches.length > 0) { cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY; }
    return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
}

function isHitbox(mx, my, x, y, w, h) {
    const P = 15; // 絶妙な広さの判定
    return mx >= (x - P) && mx <= (x + w + P) && my >= (y - P) && my <= (y + h + P);
}

function clearLongPress() { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } }

function handleMenuInputs(mx, my) {
    if (gameState === 'MAIN_MENU') {
        if (isHitbox(mx, my, 200, 250, 400, 100)) { playClickSound(); gameState = 'CLASS_SELECT'; gameMode = 'NORMAL'; return true; }
        if (isHitbox(mx, my, 200, 400, 400, 100)) { playClickSound(); initGame('DRAFT'); return true; }
        if (isHitbox(mx, my, 200, 550, 400, 100)) { playClickSound(); gameState = 'BOSS_SELECT'; return true; }
        if (isHitbox(mx, my, 350, 710, 100, 80)) { playClickSound(); gameState = 'SHOP'; return true; }
        if (isHitbox(mx, my, 10, 710, 80, 80)) { playClickSound(); gameState = 'SETTINGS'; return true; }
        if (isHitbox(mx, my, 710, 710, 80, 80)) { playClickSound(); gameState = 'UPDATE_NOTES'; return true; }
        return false;
    }
    if (gameState === 'SHOP') {
        if (isHitbox(mx, my, 20, 20, 100, 40)) { playClickSound(); gameState = 'MAIN_MENU'; return true; }
        for(let i=0; i<SHOP_ITEMS.length; i++) {
            let item = SHOP_ITEMS[i]; let ix = 150; let iy = 200 + i * 140;
            if (isHitbox(mx, my, ix, iy, 500, 100)) {
                if (playerGold >= item.price) {
                    playerGold -= item.price; playSummonSound(); showPopup(`${item.name}を購入！(仮)`, '#ffd700'); saveData();
                } else { playErrorSound(); showPopup(`ゴールドが足りません！`, '#ff3333'); }
                return true;
            }
        }
        return false;
    }
    if (gameState === 'SETTINGS') {
        if (isHitbox(mx, my, 20, 20, 100, 40)) { playClickSound(); saveData(); gameState = 'MAIN_MENU'; return true; }
        if (isHitbox(mx, my, 200, 280, 400, 30)) {
            masterVolume = (mx - 200) / 400; if (masterVolume < 0) masterVolume = 0; if (masterVolume > 1) masterVolume = 1; playClickSound(); return true;
        }
        for (let i = 0; i < 3; i++) {
            let sx = 200 + i * 150;
            if (isHitbox(mx, my, sx, 500, 100, 140)) { sleeveColor = i; playClickSound(); return true; }
        }
        return false;
    }
    if (gameState === 'UPDATE_NOTES') {
        if (isHitbox(mx, my, 20, 20, 100, 40)) { playClickSound(); gameState = 'MAIN_MENU'; return true; }
        return false;
    }
    if (gameState === 'BOSS_SELECT') {
        if (isHitbox(mx, my, 20, 20, 100, 40)) { playClickSound(); gameState = 'MAIN_MENU'; return true; }
        if (isHitbox(mx, my, 200, 200, 400, 100)) { playClickSound(); bossLevel = 1; gameState = 'CLASS_SELECT'; gameMode = 'BOSS'; return true; }
        if (isHitbox(mx, my, 200, 350, 400, 100)) { playClickSound(); bossLevel = 2; gameState = 'CLASS_SELECT'; gameMode = 'BOSS'; return true; }
        if (isHitbox(mx, my, 200, 500, 400, 100)) { playClickSound(); bossLevel = 3; gameState = 'CLASS_SELECT'; gameMode = 'BOSS'; return true; }
        return false;
    }
    if (gameState === 'CLASS_SELECT') {
        if (isHitbox(mx, my, 20, 20, 100, 40)) { playClickSound(); gameState = (gameMode === 'BOSS') ? 'BOSS_SELECT' : 'MAIN_MENU'; return true; }
        const keys = Object.keys(DECKS);
        for (let i = 0; i < keys.length; i++) {
            let dx = 70 + (i % 2) * 340; let dy = 160 + Math.floor(i / 2) * 150; 
            if (isHitbox(mx, my, dx, dy, 310, 110)) { playClickSound(); selectedClassKey = keys[i]; gameState = 'ARCHETYPE_SELECT'; return true; }
        }
        return false;
    }
    if (gameState === 'ARCHETYPE_SELECT') {
        if (isHitbox(mx, my, 20, 20, 100, 40)) { playClickSound(); gameState = 'CLASS_SELECT'; return true; }
        const archs = DECK_INFO[selectedClassKey].archetypes;
        for (let i = 0; i < archs.length; i++) {
            let dx = 200; let dy = 200 + i * 150;
            if (isHitbox(mx, my, dx, dy, 400, 110)) { playClickSound(); initGame(gameMode, selectedClassKey, archs[i].id); return true; }
        }
        return false;
    }
    if (gameState === 'DRAFT') {
        for (let i = 0; i < 3; i++) {
            let dx = 150 + i * 180; let dy = 350;
            if (isHitbox(mx, my, dx, dy, 160, 230)) {
                playDraftSelectSound(); playerDeck.push(createCard(draftOptions[i])); draftCount++;
                if (draftCount >= 40) { startCoinToss(); } else { generateDraftOptions(); }
                return true;
            }
        }
        return false;
    }
    if (gameState === 'GAMEOVER') {
        if (isHitbox(mx, my, 300, 550, 200, 50)) { playClickSound(); gameState = 'MAIN_MENU'; return true; }
        return false;
    }
    return false;
}

let isHandlingTouch = false;

function handleInputStartReal(e) {
    if (e.cancelable) e.preventDefault(); 
    if (e.type === 'touchstart') isHandlingTouch = true;
    if (e.type === 'mousedown' && isHandlingTouch) return; 

    initAudio(); 
    const pos = getPointerPos(e); 
    const mx = pos.x; 
    const my = pos.y;
    
    if (gameState !== 'BATTLE' && gameState !== 'COIN_TOSS') { handleMenuInputs(mx, my); return; }
    
    if (zoomedCard) { playClickSound(); zoomedCard = null; return; }
    if (showBattleLog) { if (isHitbox(mx, my, 650, 20, 100, 40)) { playClickSound(); showBattleLog = false; } return; }

    if (isAITurn || gameState === 'COIN_TOSS') {
        if (gameState === 'BATTLE' && isHitbox(mx, my, 680, 650, 100, 50)) { playClickSound(); isHandHidden = !isHandHidden; }
        return;
    }

    if (isHitbox(mx, my, 680, 20, 100, 40)) { playClickSound(); showBattleLog = true; return; }
    if (isHitbox(mx, my, 680, 650, 100, 50)) { playClickSound(); isHandHidden = !isHandHidden; return; }
    
    if (!hasEvolvedThisTurn && playerEP > 0 && canPlayerEvolve() && isHitbox(mx, my, 10, 550, 100, 50)) { 
        playClickSound(); evolveMode = !evolveMode; return; 
    }

    touchStartX = mx; touchStartY = my;
    let foundCardToZoom = null;

    if (!isHandHidden && !evolveMode) {
        for (let i = playerHand.length - 1; i >= 0; i--) {
            let c = playerHand[i];
            if (isHitbox(mx, my, c.x, c.y, CARD_W, CARD_H)) {
                foundCardToZoom = c;
                let cst = c.cost;
                if (c.ability.includes('VENGEANCE_COST_1') && playerHP <= 10) cst = 1;
                if (playerPP >= cst) { draggedCard = { card: c, index: i, type: 'HAND' }; dragOffset.x = mx - c.x; dragOffset.y = my - c.y; }
                break;
            }
        }
    }

    if (!foundCardToZoom) {
        [...playerBoard, ...enemyBoard, ...enemyHand].forEach(c => {
            if (isHitbox(mx, my, c.x, c.y, CARD_W, CARD_H)) { foundCardToZoom = c; }
        });
    }

    if (foundCardToZoom) {
        longPressTimer = setTimeout(() => { zoomedCard = foundCardToZoom; draggedCard = null; activeAttacker = null; playClickSound(); }, 400); 
    }

    if (draggedCard) { playClickSound(); return; }

    for (let i = 0; i < playerBoard.length; i++) {
        let c = playerBoard[i];
        if (isHitbox(mx, my, c.x, c.y, CARD_W, CARD_H)) {
            if (evolveMode && !c.isEvolved && c.type === 'FOLLOWER') {
                playerEP--; c.isEvolved = true; c.evolveTimer = 30;
                c.atk += 2; c.hp += 2; c.maxHp += 2; c.baseAtk += 2; c.baseHp += 2;
                if (!c.ready && c.attacksLeft > 0) { c.ready = true; if (!c.ability.includes('STORM')) c.rushThisTurn = true; }
                hasEvolvedThisTurn = true; evolveMode = false; playEvolveSound(); showPopup('進化！', '#ffeb3b'); 
                addBattleLog(`あなたの ${c.name} が進化！`, true); clearLongPress(); return;
            }
            if (c.ready && c.attacksLeft > 0 && !evolveMode && c.type === 'FOLLOWER') { 
                playClickSound(); activeAttacker = { card: c, index: i }; return; 
            }
        }
    }
    
    if (!evolveMode && isHitbox(mx, my, 650, 375, 130, 50)) { playClickSound(); endTurn(); clearLongPress(); }
}

function handleInputMove(e) {
    if (e.cancelable) e.preventDefault(); 
    const pos = getPointerPos(e); mousePos.x = pos.x; mousePos.y = pos.y;
    
    if (longPressTimer) {
        if (Math.abs(mousePos.x - touchStartX) > 10 || Math.abs(mousePos.y - touchStartY) > 10) { clearLongPress(); }
    }

    if (draggedCard) { draggedCard.card.x = mousePos.x - dragOffset.x; draggedCard.card.y = mousePos.y - dragOffset.y; }

    if (gameState === 'SETTINGS' && e.buttons > 0) {
        if (isHitbox(mousePos.x, mousePos.y, 200, 280, 400, 30)) {
            masterVolume = (mousePos.x - 200) / 400; if (masterVolume < 0) masterVolume = 0; if (masterVolume > 1) masterVolume = 1;
        }
    }
}

function handleInputEnd(e) {
    if (e.cancelable) e.preventDefault(); 
    if (e.type === 'touchend') { setTimeout(() => { isHandlingTouch = false; }, 500); }

    clearLongPress();
    if (gameState !== 'BATTLE' || isAITurn || zoomedCard || showBattleLog) return;
    if (!draggedCard && !activeAttacker) return;
    
    const pos = getPointerPos(e); const mx = pos.x; const my = pos.y;

    if (draggedCard && draggedCard.type === 'HAND') {
        let c = draggedCard.card;
        
        if (my < 620) { 
            let targetEnemy = enemyBoard.find(enemy => isHitbox(mx, my, enemy.x, enemy.y, CARD_W, CARD_H));
            let isFaceDrop = (my < 350 && !targetEnemy);
            
            let reqTarget = requiresTarget(c);
            let reqFollowerOnly = c.ability.some(a => a.includes('DEBUFF') || a.includes('KILL_TARGET') || a.includes('DESTROY_AMULET'));

            if (reqTarget) {
                if (targetEnemy) { playCardFromHand(draggedCard, targetEnemy, false, true); } 
                else if (isFaceDrop && !reqFollowerOnly) { playCardFromHand(draggedCard, null, true, true); } 
                else { showPopup("対象に直接ドロップしてください", "#f00"); playErrorSound(); }
            } else {
                if (c.type === 'FOLLOWER' || c.type === 'AMULET') {
                    if (playerBoard.length < 5) playCardFromHand(draggedCard, null, false, true);
                    else { showPopup("盤面がいっぱいです！", "#f00"); playErrorSound(); }
                } else { playCardFromHand(draggedCard, null, false, true); }
            }
        }
        draggedCard = null;
    }

    if (activeAttacker) {
        let hasEnemyWard = enemyBoard.some(c => c.ability.includes('WARD') && !c.ability.includes('INVINCIBLE')); 
        let attackSuccess = false; let targetForAnim = null;

        for (let i = 0; i < enemyBoard.length; i++) {
            let enemy = enemyBoard[i];
            if (isHitbox(mx, my, enemy.x, enemy.y, CARD_W, CARD_H) && enemy.type === 'FOLLOWER') {
                if (hasEnemyWard && !enemy.ability.includes('WARD') && !enemy.ability.includes('INVINCIBLE')) { 
                    playErrorSound(); showPopup("【守護】を攻撃してください！", '#ff0000'); activeAttacker = null; return; 
                }
                
                let atkHasKill = activeAttacker.card.ability.includes('ATTACK_KILL'); 
                let defHasKill = enemy.ability.includes('ATTACK_KILL');
                
                if (atkHasKill && !enemy.ability.includes('INVINCIBLE')) enemy.hp = 0; 
                else if (!enemy.ability.includes('INVINCIBLE')) enemy.hp -= activeAttacker.card.atk; 
                
                if (defHasKill && !activeAttacker.card.ability.includes('INVINCIBLE')) activeAttacker.card.hp = 0; 
                else if (!activeAttacker.card.ability.includes('INVINCIBLE')) activeAttacker.card.hp -= enemy.atk; 
                
                attackSuccess = true; targetForAnim = enemy; break;
            }
        }
        if (!attackSuccess && my < 350 && !activeAttacker.card.rushThisTurn) { 
            if (hasEnemyWard) { playErrorSound(); showPopup("敵の【守護】が邪魔で顔面を狙えない！", '#ff0000'); activeAttacker = null; return; }
            enemyHP -= activeAttacker.card.atk; attackSuccess = true; targetForAnim = 'FACE'; showPopup("ダイレクトアタック！！", '#ffaa00');
        } else if (!attackSuccess && my < 350 && activeAttacker.card.rushThisTurn) {
            playErrorSound(); showPopup("突進は顔面を攻撃できない！", '#f00'); activeAttacker = null; return;
        }
        
        if (attackSuccess) {
            playAttackSound(); playDamageSound();
            addBattleLog(`あなたの ${activeAttacker.card.name} が ${targetForAnim === 'FACE' ? '敵リーダー' : targetForAnim.name} に攻撃！`, true);

            activeAttacker.card.attackAnimTimer = 15;
            activeAttacker.card.attackTargetX = targetForAnim === 'FACE' ? 400 : targetForAnim.x + CARD_W/2;
            activeAttacker.card.attackTargetY = targetForAnim === 'FACE' ? 100 : targetForAnim.y + CARD_H/2;

            if (activeAttacker.card.ability.includes('ATTACK_LEADER_DMG_1')) playerHP -= 1;
            if (activeAttacker.card.ability.includes('HEAL_FULL_ON_KILL') && activeAttacker.card.hp > 0) activeAttacker.card.hp = activeAttacker.card.maxHp;
            activeAttacker.card.attacksLeft--; if (activeAttacker.card.attacksLeft <= 0) activeAttacker.card.ready = false;
        }
        checkDeath(); activeAttacker = null;
    }
    checkWinLoss();
}

canvas.addEventListener('mousedown', handleInputStartReal); 
canvas.addEventListener('touchstart', handleInputStartReal, {passive: false});
canvas.addEventListener('mousemove', handleInputMove); 
canvas.addEventListener('touchmove', handleInputMove, {passive: false});
canvas.addEventListener('mouseup', handleInputEnd); 
canvas.addEventListener('touchend', handleInputEnd, {passive: false});

// ==========================================
// ターン処理関連
// ==========================================
function processTurnEndEffects(isPlayer) {
    try {
        let board = isPlayer ? playerBoard : enemyBoard;
        board.forEach(c => {
            let abStr = c.ability.join(',');
            c.ability.forEach(ab => {
                let hm = ab.match(/TURN_END_HEAL_LEADER_(\d+)/);
                if (hm) { 
                    let h = parseInt(hm[1]); 
                    if (isPlayer) playerHP = Math.min(pMaxHP, playerHP + h); 
                    else enemyHP = Math.min(eMaxHP, enemyHP + h); 
                    playHealSound(); showPopup(`ターン終了回復`, '#fbc02d'); 
                }
                if (ab === 'TURN_END_HEAL_FULL') c.hp = c.maxHp;
                if (ab === 'TURN_END_DESTROY_SELF') c.hp = 0;
                if (ab === 'TURN_END_BANISH') c.hp = 0; 
                let bm = ab.match(/TURN_END_BURN_FACE_(\d+)/);
                if (bm) { let d = parseInt(bm[1]); if (isPlayer) enemyHP -= d; else playerHP -= d; playDamageSound(); }
                let dm = ab.match(/TURN_END_DRAW_(\d+)/);
                if (dm) { drawCardToHand(isPlayer, parseInt(dm[1])); }
                if (ab === 'TURN_END_SUMMON_CUCUMBER') { if(board.length < 5) board.push(createCard(TOKENS.CUCUMBER_SOLDIER)); }
                if (ab === 'TURN_END_SUMMON_DRAGON') { if(board.length < 5) board.push(createCard(TOKENS.DRAGON_5_5)); }
                if (ab === 'TURN_END_SUMMON_SKELETON') { if(board.length < 5) board.push(createCard(TOKENS.SKELETON)); }
                if (ab === 'TURN_END_BOTH_DRAW_2') { drawCardToHand(true, 2); drawCardToHand(false, 2); showPopup("お互い2ドロー！", "#00bcd4"); }
            });
            c.rushThisTurn = false; 
        });
        checkDeath();
    } catch(e) { console.error("Turn End Error:", e); }
}

function endTurn() {
    processTurnEndEffects(true); 
    globalTurn++; showPopup("相手のターン", '#aaa');
    
    if (enemyMaxPP < 10) enemyMaxPP++; enemyPP = enemyMaxPP;
    enemyBoard.forEach(c => { if(c.type === 'FOLLOWER') { c.ready = true; c.attacksLeft = c.ability.includes('TWICE_ATTACK') ? 2 : 1; }});
    cardsPlayedThisTurn = 0; 
    hasEvolvedThisTurn = false;
    processTurnStartCountdown(false); 
    drawCardToHand(false, 1);
    
    enemyAITask(); 
}

async function enemyAITask() {
    isAITurn = true; 
    try {
        await new Promise(r => setTimeout(r, 1000));
        if (gameState !== 'BATTLE') return;

        let canPlay = true;
        while(canPlay && gameState === 'BATTLE') {
            canPlay = false; let sortedHand = enemyHand.slice().sort((a,b) => b.cost - a.cost);
            for (let i = 0; i < sortedHand.length; i++) {
                let c = sortedHand[i]; let handIdx = enemyHand.indexOf(c); if (handIdx === -1) continue;
                
                let cst = c.cost;
                if (c.ability.includes('VENGEANCE_COST_1') && enemyHP <= 10) cst = 1;

                if (enemyPP >= cst) {
                    let target = null, targetFace = false;
                    if (requiresTarget(c)) {
                        let validTargets = playerBoard.filter(t => !t.ability.includes('INVINCIBLE') && (t.type === 'FOLLOWER' || (c.ability.join(',').includes('AMULET_DESTROY') && t.type === 'AMULET')));
                        let reqFollowerOnly = c.ability.some(a => a.includes('DEBUFF') || a.includes('KILL_TARGET') || a.includes('DESTROY_AMULET'));
                        if (validTargets.length > 0) {
                            target = validTargets[Math.floor(Math.random() * validTargets.length)];
                        } else if (!reqFollowerOnly) {
                            targetFace = true;
                        } else { continue; }
                    }
                    if (c.type === 'SPELL' || ((c.type === 'FOLLOWER' || c.type === 'AMULET') && enemyBoard.length < 5)) {
                        let played = playCardFromHand({card:c, index:handIdx}, target, targetFace, false);
                        if (played) { showEnemyPlayNotification(c); canPlay = true; await new Promise(r => setTimeout(r, 1200)); break; }
                    }
                }
            }
        }

        if (gameState === 'BATTLE' && !hasEvolvedThisTurn && enemyEP > 0 && canEnemyEvolve()) {
            let unevolved = enemyBoard.filter(c => c.type === 'FOLLOWER' && !c.isEvolved);
            if (unevolved.length > 0) {
                let c = unevolved[0]; enemyEP--; 
                c.isEvolved = true; c.evolveTimer = 30;
                c.atk += 2; c.hp += 2; c.maxHp += 2; c.baseAtk += 2; c.baseHp += 2;
                if (!c.ready && c.attacksLeft > 0) { c.ready = true; if (!c.ability.includes('STORM')) c.rushThisTurn = true; }
                c.attacksLeft = c.ability.includes('TWICE_ATTACK') ? 2 : 1;
                hasEvolvedThisTurn = true; addBattleLog(`敵が「${c.name}」を進化！`, false);
                playEvolveSound(); showPopup('敵が進化！', '#ffeb3b'); await new Promise(r => setTimeout(r, 1000));
            }
        }

        let canAttack = true;
        while(canAttack && gameState === 'BATTLE') {
            canAttack = false; let attacker = enemyBoard.find(c => c.type === 'FOLLOWER' && c.ready && c.attacksLeft > 0 && c.hp > 0);
            if (attacker) {
                let target = null; 
                let playerWards = playerBoard.filter(c => c.ability.includes('WARD') && !c.ability.includes('INVINCIBLE') && c.type === 'FOLLOWER');
                let targetForAnim = null;

                let playerTotalAtk = 0;
                playerBoard.forEach(c => { if(c.type === 'FOLLOWER' && c.ready) playerTotalAtk += c.atk; });
                
                let isPinch = (enemyHP <= 4) || (playerTotalAtk >= enemyHP);

                if (playerWards.length > 0) {
                    target = playerWards.find(w => attacker.atk >= w.hp) || playerWards[0];
                } else {
                    let bestTrade = null; let bestScore = -100;
                    playerBoard.forEach(pf => {
                        if (pf.type !== 'FOLLOWER' || pf.ability.includes('INVINCIBLE')) return;
                        if (pf.ability.includes('DEATH_SUMMON_MORDECAI') && pf.atk < 7 && pf.hp < 7) return; 
                        
                        let canKill = (attacker.atk >= pf.hp || attacker.ability.includes('ATTACK_KILL')); 
                        let willDie = (!attacker.ability.includes('INVINCIBLE') && (attacker.hp <= pf.atk || pf.ability.includes('ATTACK_KILL')));
                        let score = 0;
                        
                        if (isPinch && canKill) {
                            score = 100 + pf.atk * 20; 
                        } else {
                            if (canKill && !willDie) score = 50 + pf.atk * 10;
                            else if (canKill && willDie) {
                                if (attacker.ability.includes('WARD') && enemyHP >= 10 && !pf.ability.includes('WARD')) score = -20;
                                else score = (pf.atk >= attacker.atk || pf.cost >= attacker.cost) ? 20 + pf.atk * 5 : -10;
                            }
                            else if (!canKill && willDie) score = -50; 
                        }
                        if (score > bestScore && score > 0) { bestScore = score; bestTrade = pf; }
                    });
                    
                    if (!isPinch && attacker.atk >= playerHP && !attacker.rushThisTurn) { target = null; } 
                    else if (bestTrade) { target = bestTrade; } 
                    else if (attacker.rushThisTurn) { target = null; }
                }

                if (target) {
                    let atkHasKill = attacker.ability.includes('ATTACK_KILL'); 
                    let defHasKill = target.ability.includes('ATTACK_KILL');
                    if (atkHasKill && !target.ability.includes('INVINCIBLE')) target.hp = 0; 
                    else if (!target.ability.includes('INVINCIBLE')) target.hp -= attacker.atk; 
                    if (defHasKill && !attacker.ability.includes('INVINCIBLE')) attacker.hp = 0;
                    else if (!attacker.ability.includes('INVINCIBLE')) attacker.hp -= target.atk;
                    targetForAnim = target;
                } else if (!attacker.rushThisTurn) { 
                    playerHP -= attacker.atk; targetForAnim = 'FACE'; 
                } else { attacker.attacksLeft = 0; continue; }
                
                playAttackSound(); playDamageSound();
                addBattleLog(`敵の ${attacker.name} が ${targetForAnim === 'FACE' ? 'あなたのリーダー' : targetForAnim.name} に攻撃！`, false);

                attacker.attackAnimTimer = 15;
                attacker.attackTargetX = targetForAnim === 'FACE' ? 400 : targetForAnim.x + CARD_W/2;
                attacker.attackTargetY = targetForAnim === 'FACE' ? 700 : targetForAnim.y + CARD_H/2;

                if (attacker.ability.includes('ATTACK_LEADER_DMG_1')) playerHP -= 1;
                if (attacker.ability.includes('HEAL_FULL_ON_KILL') && attacker.hp > 0) attacker.hp = attacker.maxHp;
                attacker.attacksLeft--; if (attacker.attacksLeft <= 0) attacker.ready = false;
                checkDeath(); canAttack = true; await new Promise(r => setTimeout(r, 800));
            }
        }
    } catch(e) {
        console.error("AI Error:", e);
    } finally {
        if(gameState === 'BATTLE') {
            checkWinLoss(); processTurnEndEffects(false);
            if (playerMaxPP < 10) playerMaxPP++; playerPP = playerMaxPP;
            playerBoard.forEach(c => { if(c.type === 'FOLLOWER'){ c.ready = true; c.attacksLeft = c.ability.includes('TWICE_ATTACK') ? 2 : 1; }});
            cardsPlayedThisTurn = 0; processTurnStartCountdown(true); drawCardToHand(true, 1); 
            globalTurn++; hasEvolvedThisTurn = false;
            showPopup("あなたのターン！", '#00f2fe'); isHandHidden = false; 
            if (canPlayerEvolve() && !p1EvolvedNotified) { setTimeout(()=>showPopup("進化が可能に！", "#ffeb3b"), 800); p1EvolvedNotified = true; }
        }
        isAITurn = false; 
    }
}

function checkWinLoss() {
    if (playerHP <= 0 || enemyHP <= 0) {
        if (gameState !== 'GAMEOVER') {
            gameState = 'GAMEOVER'; 
            if (playerHP <= 0) { winMessage = 'YOU LOSE...'; } 
            else { winMessage = 'YOU WIN!!'; playerGold += 100; showPopup("100 G獲得！", '#ffd700'); }
            saveData(); 
        }
    }
}

function updateCardPositions() {
    try {
        let phLen = playerHand.length;
        playerHand.forEach((c, idx) => {
            if (draggedCard && draggedCard.card === c) return; 
            let offset = idx - (phLen - 1) / 2;
            c.targetX = (canvas.width / 2 - CARD_W / 2) + offset * 80; c.targetY = isHandHidden ? 900 : (630 + Math.abs(offset) * 8); 
            c.x += (c.targetX - c.x) * 0.15; c.y += (c.targetY - c.y) * 0.15; 
        });

        let ehLen = enemyHand.length;
        enemyHand.forEach((c, idx) => {
            let offset = idx - (ehLen - 1) / 2;
            c.targetX = (canvas.width / 2 - CARD_W / 2) + offset * 60; c.targetY = (!isAITurn) ? -150 : -50 + Math.abs(offset) * 5; 
            c.x += (c.targetX - c.x) * 0.15; c.y += (c.targetY - c.y) * 0.15;
        });

        let pbLen = playerBoard.length;
        playerBoard.forEach((c, idx) => {
            let offset = idx - (pbLen - 1) / 2;
            c.targetX = (canvas.width / 2 - CARD_W / 2) + offset * (CARD_W + 15); c.targetY = 450;
            c.x += (c.targetX - c.x) * 0.2; c.y += (c.targetY - c.y) * 0.2;
        });

        let ebLen = enemyBoard.length;
        enemyBoard.forEach((c, idx) => {
            let offset = idx - (ebLen - 1) / 2;
            c.targetX = (canvas.width / 2 - CARD_W / 2) + offset * (CARD_W + 15); c.targetY = 250;
            c.x += (c.targetX - c.x) * 0.2; c.y += (c.targetY - c.y) * 0.2;
        });
    } catch(e) {}
}

function drawCard(c, isEnemy = false, isPlayable = false, isLog = false) {
    let origX = c.x, origY = c.y;
    try {
        if (c.attackAnimTimer > 0) {
            let p = 1 - c.attackAnimTimer / 15;
            let move = Math.sin(p * Math.PI);
            c.x += (c.attackTargetX - (origX + CARD_W/2)) * move * 0.4;
            c.y += (c.attackTargetY - (origY + CARD_H/2)) * move * 0.4;
            c.attackAnimTimer--;
        }

        ctx.save();
        if (c.evolveTimer > 0) {
            ctx.translate(c.x + CARD_W/2, c.y + CARD_H/2); ctx.scale(Math.abs(Math.cos(c.evolveTimer * 0.2)), 1);
            ctx.translate(-(c.x + CARD_W/2), -(c.y + CARD_H/2)); c.evolveTimer--;
        }

        if (c.ready && c.attacksLeft > 0 && !isEnemy && playerBoard.includes(c) && c.type === 'FOLLOWER' && !evolveMode && !isLog) { ctx.shadowBlur = 15; ctx.shadowColor = '#00f2fe'; } 
        else if (isPlayable && c.type !== 'ENEMY_HAND' && !isHandHidden && !isLog) { ctx.shadowBlur = 10; ctx.shadowColor = '#00ff66'; } 
        else if (evolveMode && !isEnemy && playerBoard.includes(c) && !c.isEvolved && c.type === 'FOLLOWER' && !isLog) { ctx.shadowBlur = 20; ctx.shadowColor = '#ffeb3b'; }
        else if (!isLog) { ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(0,0,0,0.6)'; }
        
        ctx.fillStyle = c.color || '#333'; ctx.fillRect(c.x, c.y, CARD_W, CARD_H);
        ctx.lineWidth = 3;
        
        if (c.type === 'ENEMY_HAND' && !isLog) {
            ctx.strokeStyle = '#555'; ctx.strokeRect(c.x, c.y, CARD_W, CARD_H);
            ctx.fillStyle = SLEEVE_COLORS[enemySleeveColor]; ctx.fillRect(c.x + 4, c.y + 4, CARD_W - 8, CARD_H - 8);
            ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 2; ctx.strokeRect(c.x + 8, c.y + 8, CARD_W - 16, CARD_H - 16);
            ctx.fillStyle = '#000'; ctx.fillRect(c.x + CARD_W/2 - 10, c.y + CARD_H/2 - 10, 20, 20); ctx.restore(); return;
        }

        if (c.isEvolved) { ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 4; }
        else if (c.type === 'AMULET') { ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = 4; }
        else if (c.ability.includes('WARD')) { ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 5; }
        else if (c.ability.includes('INVINCIBLE')) { ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 5; }
        else if (c.ability.includes('ATTACK_KILL')) { ctx.strokeStyle = '#9c27b0'; ctx.lineWidth = 4; }
        else if (c.type === 'SPELL') ctx.strokeStyle = '#9c27b0'; else ctx.strokeStyle = '#222';
        
        ctx.strokeRect(c.x, c.y, CARD_W, CARD_H); ctx.restore();

        ctx.fillStyle = c.textColor || '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(c.name || '???', c.x + CARD_W/2, c.y + 25);
        ctx.font = '9px sans-serif'; const lines = (c.desc || '').split('\n'); lines.forEach((line, i) => ctx.fillText(line, c.x + CARD_W/2, c.y + 45 + (i * 12)));

        ctx.fillStyle = '#0055ff'; ctx.beginPath(); ctx.arc(c.x + 14, c.y + 14, 12, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; 
        let cst = c.cost || 0;
        if (c.ability && c.ability.includes('VENGEANCE_COST_1') && (isEnemy ? enemyHP : playerHP) <= 10) cst = 1;
        ctx.fillText(cst, c.x + 14, c.y + 19);

        if (c.countdown > 0) {
            ctx.fillStyle = '#ffeb3b'; ctx.beginPath(); ctx.arc(c.x + CARD_W/2, c.y + CARD_H/2 + 20, 15, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.font = 'bold 16px sans-serif'; ctx.fillText(c.countdown, c.x + CARD_W/2, c.y + CARD_H/2 + 25);
        }

        if (c.type === 'FOLLOWER') {
            ctx.fillStyle = '#ffaa00'; ctx.beginPath(); ctx.arc(c.x + 14, c.y + CARD_H - 14, 12, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = (c.atk > c.baseAtk) ? '#00ff00' : (c.atk < c.baseAtk ? '#ff3333' : '#fff'); ctx.fillText(c.atk || 0, c.x + 14, c.y + CARD_H - 9);
            ctx.fillStyle = '#ff2255'; ctx.beginPath(); ctx.arc(c.x + CARD_W - 14, c.y + CARD_H - 14, 12, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = (c.hp < c.maxHp) ? '#ff9999' : (c.hp > c.baseHp ? '#00ff00' : '#fff'); ctx.fillText(c.hp || 0, c.x + CARD_W - 14, c.y + CARD_H - 9);
        }
    } catch(e) { } finally { c.x = origX; c.y = origY; }
}

        ctx.fillStyle = l.color; ctx.fillRect(200, l.y, 400, 100); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.strokeRect(200, l.y, 400, 100);
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 26px sans-serif'; ctx.fillText(l.label, 400, l.y + 45);
        ctx.font = '14px sans-serif'; ctx.fillText(l.desc, 400, l.y + 80);
    });
}

function drawClassSelectScreen() {
    ctx.fillStyle = '#0b0c16'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('使用するクラスを選択', canvas.width/2, 100);

    ctx.fillStyle = '#555'; ctx.fillRect(20, 20, 100, 40); ctx.strokeStyle = '#fff'; ctx.strokeRect(20, 20, 100, 40);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('戻る', 70, 45);

    const keys = Object.keys(DECKS);
    keys.forEach((key, idx) => {
        let dx = 70 + (idx % 2) * 340; let dy = 160 + Math.floor(idx / 2) * 150; let info = DECK_INFO[key];
        ctx.fillStyle = info.color; ctx.fillRect(dx, dy, 310, 110); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(dx, dy, 310, 110);
        ctx.fillStyle = getTextColor(info.color); ctx.font = 'bold 20px sans-serif'; ctx.fillText(info.name, dx + 155, dy + 40);
        ctx.font = '12px sans-serif'; ctx.fillText(info.desc, dx + 155, dy + 75);
    });
}

function drawArchetypeSelectScreen() {
    ctx.fillStyle = '#0b0c16'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    let classInfo = DECK_INFO[selectedClassKey];
    ctx.fillStyle = classInfo.color; ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'center'; 
    ctx.fillText(`${classInfo.name}のデッキタイプを選択`, canvas.width/2, 100);

    ctx.fillStyle = '#555'; ctx.fillRect(20, 20, 100, 40); ctx.strokeStyle = '#fff'; ctx.strokeRect(20, 20, 100, 40);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('戻る', 70, 45);

    const archs = classInfo.archetypes;
    archs.forEach((arch, idx) => {
        let dx = 200; let dy = 200 + idx * 150;
        ctx.fillStyle = '#222'; ctx.fillRect(dx, dy, 400, 110); ctx.strokeStyle = classInfo.color; ctx.lineWidth = 4; ctx.strokeRect(dx, dy, 400, 110);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 24px sans-serif'; ctx.fillText(arch.name, dx + 200, dy + 45);
        ctx.fillStyle = '#aaa'; ctx.font = '14px sans-serif'; ctx.fillText(arch.desc, dx + 200, dy + 80);
    });
}

function drawDraftScreen() {
    ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff007f'; ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center'; ctx.shadowBlur = 10; ctx.shadowColor = '#fff';
    ctx.fillText('PRIZE GET! カードを選択！', canvas.width/2, 100); ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = '20px sans-serif'; ctx.fillText(`Drafting: ${draftCount} / 40`, canvas.width/2, 150);

    for(let i=0; i<3; i++) {
        let c = draftOptions[i]; let dx = 150 + i * 180; let dy = 350;
        ctx.fillStyle = c.color || '#333'; ctx.fillRect(dx, dy, 160, 230); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.strokeRect(dx, dy, 160, 230);
        ctx.fillStyle = c.textColor; ctx.font = 'bold 16px sans-serif'; ctx.fillText(c.name, dx + 80, dy + 40);
        ctx.font = '12px sans-serif'; const lines = (c.desc || '').split('\n'); lines.forEach((line, j) => ctx.fillText(line, dx + 80, dy + 100 + (j * 15)));
        ctx.fillStyle = '#0055ff'; ctx.beginPath(); ctx.arc(dx + 25, dy + 25, 18, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = 'bold 18px sans-serif'; ctx.fillText(c.cost, dx + 25, dy + 32);
        if (c.type === 'FOLLOWER') {
            ctx.fillStyle = '#ffaa00'; ctx.beginPath(); ctx.arc(dx + 25, dy + 205, 18, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillText(c.atk, dx + 25, dy + 212);
            ctx.fillStyle = '#ff2255'; ctx.beginPath(); ctx.arc(dx + 135, dy + 205, 18, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillText(c.hp, dx + 135, dy + 212);
        }
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = playerHP <= 0 ? '#ff3333' : '#00f2fe'; ctx.font = 'bold 60px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(winMessage, canvas.width/2, canvas.height/2 - 50);
    ctx.fillStyle = '#3f51b5'; ctx.fillRect(300, 550, 200, 50); ctx.strokeStyle = '#fff'; ctx.strokeRect(300, 550, 200, 50); ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.fillText('メインメニューへ', 400, 583);
}

function drawDeck(x, y, count, isEnemy) {
    if (count <= 0) return; ctx.save(); let col = isEnemy ? enemySleeveColor : sleeveColor;
    ctx.fillStyle = SLEEVE_COLORS[col]; ctx.fillRect(x, y, CARD_W, CARD_H); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(x, y, CARD_W, CARD_H);
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 2; ctx.strokeRect(x+5, y+5, CARD_W-10, CARD_H-10);
    ctx.fillStyle = '#000'; ctx.fillRect(x + CARD_W - 30, y + CARD_H - 30, 26, 26);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(count, x + CARD_W - 17, y + CARD_H - 12); ctx.restore();
}

function drawBattleLog() {
    ctx.fillStyle = 'rgba(0,0,0,0.95)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('プレイ履歴', 400, 60);
    ctx.fillStyle = '#555'; ctx.fillRect(650, 20, 100, 40); ctx.strokeStyle = '#fff'; ctx.strokeRect(650, 20, 100, 40);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('閉じる', 700, 45);

    ctx.textAlign = 'left'; let ly = 120;
    for(let i = 0; i < battleLog.length; i++) {
        if (ly > 780) break; let log = battleLog[i];
        if (log.isPlayer === true) ctx.fillStyle = '#00f2fe'; else if (log.isPlayer === false) ctx.fillStyle = '#ff5722'; else ctx.fillStyle = '#fff';
        ctx.font = '16px sans-serif'; ctx.fillText(`[Turn ${log.turn}] ${log.text}`, 50, ly); ly += 25;
    }
}

function drawZoomedCard() {
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    let cw = CARD_W * 2.5; let ch = CARD_H * 2.5; let cx = canvas.width / 2 - cw / 2; let cy = canvas.height / 2 - ch / 2;
    ctx.fillStyle = zoomedCard.color || '#333'; ctx.fillRect(cx, cy, cw, ch);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.strokeRect(cx, cy, cw, ch);

    ctx.fillStyle = zoomedCard.textColor || '#fff'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(zoomedCard.name || '???', cx + cw/2, cy + 50);
    ctx.font = '20px sans-serif'; const lines = (zoomedCard.desc || '').split('\n'); lines.forEach((line, i) => ctx.fillText(line, cx + cw/2, cy + 100 + (i * 25)));

    ctx.fillStyle = '#0055ff'; ctx.beginPath(); ctx.arc(cx + 30, cy + 30, 25, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = 'bold 28px sans-serif'; 
    let cst = zoomedCard.cost || 0; if (zoomedCard.ability && zoomedCard.ability.includes('VENGEANCE_COST_1') && playerHP <= 10) cst = 1;
    ctx.fillText(cst, cx + 30, cy + 40);

    if (zoomedCard.type === 'FOLLOWER') {
        ctx.fillStyle = '#ffaa00'; ctx.beginPath(); ctx.arc(cx + 30, cy + ch - 30, 25, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.fillText(zoomedCard.atk || 0, cx + 30, cy + ch - 20);
        ctx.fillStyle = '#ff2255'; ctx.beginPath(); ctx.arc(cx + cw - 30, cy + ch - 30, 25, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.fillText(zoomedCard.hp || 0, cx + cw - 30, cy + ch - 20);
    }
}

function drawBattle() {
    try {
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height); grad.addColorStop(0, '#0a0a1a'); grad.addColorStop(0.5, '#1a1a2e'); grad.addColorStop(1, '#0a0a1a');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 400); ctx.lineTo(canvas.width, 400); ctx.stroke();

        ctx.fillStyle = '#3f51b5'; ctx.beginPath(); ctx.arc(400, 90, 50, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`ENEMY: ${enemyHP}`, 400, 95);
        ctx.fillStyle = '#e91e63'; ctx.beginPath(); ctx.arc(400, 710, 50, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#fff'; ctx.fillText(`YOU: ${playerHP}`, 400, 715);

        ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left';
        ctx.fillStyle = '#00f2fe'; ctx.fillText(`PP: ${playerPP} / ${playerMaxPP}`, 30, 740);
        ctx.fillStyle = '#ffeb3b'; ctx.fillText(`EP: ${playerEP} / ${playerMaxEP}`, 30, 770);
        
        if (playerDeckClass === 'NECRO' || playerHasNecro) { ctx.fillStyle = '#aa00ff'; ctx.fillText(`墓地: ${playerGrave}`, 30, 710); }
        if (enemyDeckClass === 'NECRO' || enemyHasNecro) { ctx.fillStyle = '#aa00ff'; ctx.fillText(`敵墓地: ${enemyGrave}`, 30, 120); }

        ctx.fillStyle = '#ff0055'; ctx.fillText(`敵PP: ${enemyPP} / ${enemyMaxPP}`, 30, 60);
        ctx.fillStyle = '#ffeb3b'; ctx.fillText(`敵EP: ${enemyEP} / ${enemyMaxEP}`, 30, 90);

        ctx.fillStyle = (!isAITurn) ? '#00f2fe' : '#333'; ctx.fillRect(650, 375, 130, 50); ctx.strokeStyle = '#fff'; ctx.strokeRect(650, 375, 130, 50);
        ctx.fillStyle = (!isAITurn) ? '#000' : '#888'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText((!isAITurn) ? 'ターン終了' : '相手のターン', 715, 405);
        
        ctx.fillStyle = isHandHidden ? '#4caf50' : '#d32f2f'; ctx.fillRect(680, 650, 100, 50); ctx.strokeStyle = '#fff'; ctx.strokeRect(680, 650, 100, 50);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.fillText(isHandHidden ? '手札を出す' : '手札を隠す', 730, 680);

        if (!hasEvolvedThisTurn && canPlayerEvolve() && playerEP > 0) {
            ctx.fillStyle = evolveMode ? '#ffeb3b' : '#333'; ctx.fillRect(10, 550, 100, 50); ctx.strokeStyle = '#ffeb3b'; ctx.strokeRect(10, 550, 100, 50);
            ctx.fillStyle = evolveMode ? '#000' : '#ffeb3b'; ctx.fillText(`進化(EP:${playerEP})`, 60, 580);
        }

        ctx.fillStyle = '#444'; ctx.fillRect(680, 20, 100, 40); ctx.strokeStyle = '#fff'; ctx.strokeRect(680, 20, 100, 40);
        ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif'; ctx.fillText('📜 履歴', 730, 45);

        drawDeck(670, 450, playerDeck.length, false); drawDeck(670, 200, enemyDeck.length, true);

        playedCardsLog.forEach((log, i) => {
            ctx.save(); ctx.globalAlpha = Math.min(1, log.timer / 20);
            log.card.x = 20; log.card.y = 150 + i * 140; ctx.shadowBlur = 15; ctx.shadowColor = '#ff0055';
            drawCard(log.card, true, false, true); 
            ctx.fillStyle = '#ff0055'; ctx.font = 'bold 13px sans-serif'; ctx.fillText("Enemy Played", log.card.x + CARD_W/2, log.card.y - 8);
            ctx.restore(); log.timer--;
        });
        playedCardsLog = playedCardsLog.filter(l => l.timer > 0);

        updateCardPositions();
        enemyBoard.forEach(c => drawCard(c, true)); playerBoard.forEach(c => drawCard(c, false));
        enemyHand.forEach(c => drawCard({ ...c, type: 'ENEMY_HAND' }, true)); 
        playerHand.forEach(c => drawCard(c, false, playerPP >= c.cost)); 

        if (draggedCard) drawCard(draggedCard.card, false, true);

        if (activeAttacker) {
            ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 6; ctx.setLineDash([10, 10]); ctx.beginPath(); ctx.moveTo(activeAttacker.card.x + CARD_W/2, activeAttacker.card.y + CARD_H/2);
            ctx.lineTo(mousePos.x, mousePos.y); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = '#ff0055'; ctx.beginPath(); ctx.arc(mousePos.x, mousePos.y, 10, 0, Math.PI*2); ctx.fill();
        }

        particles.forEach((p, i) => {
            ctx.fillStyle = p.color; ctx.globalAlpha = p.life / 30; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            p.x += p.vx; p.y += p.vy; p.life--;
        });
        ctx.globalAlpha = 1; particles = particles.filter(p => p.life > 0);

        for (let i = popups.length - 1; i >= 0; i--) {
            let p = popups[i]; ctx.fillStyle = p.color; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center'; ctx.shadowBlur = 10; ctx.shadowColor = '#000'; ctx.fillText(p.text, 400, p.y);
            p.y -= 1; p.timer--; ctx.shadowBlur = 0; if (p.timer <= 0) popups.splice(i, 1);
        }

        if (showBattleLog) drawBattleLog();
        if (zoomedCard) drawZoomedCard();
    } catch(e) {}
}

function draw() {
    if (gameState === 'MAIN_MENU') drawMainMenu();
    else if (gameState === 'SHOP') drawShopScreen();
    else if (gameState === 'SETTINGS') drawSettingsScreen();
    else if (gameState === 'COIN_TOSS') {
        drawCoinToss(); coinTossTimer--;
        if (coinTossState === 0 && coinTossTimer <= 0) { coinTossState = 1; coinTossTimer = 36; playTone(800, 'sine', 0.2); } 
        else if (coinTossState === 1 && coinTossTimer <= 0) { coinTossState = 2; coinTossTimer = 60; playTone(1000, 'square', 0.3); }
        else if (coinTossState === 2 && coinTossTimer <= 0) { startGameAfterToss(); }
    }
    else if (gameState === 'BOSS_SELECT') drawBossSelectScreen();
    else if (gameState === 'CLASS_SELECT') drawClassSelectScreen();
    else if (gameState === 'ARCHETYPE_SELECT') drawArchetypeSelectScreen();
    else if (gameState === 'SELECT') drawSelectScreen();
    else if (gameState === 'DRAFT') drawDraftScreen();
    else if (gameState === 'BATTLE') drawBattle();
    else if (gameState === 'UPDATE_NOTES') drawUpdateNotesScreen();
    else if (gameState === 'GAMEOVER') { drawBattle(); drawGameOver(); }
}

function gameLoop() { draw(); requestAnimationFrame(gameLoop); } 
gameLoop();

// ----------------------------------------------------
// イベントリスナーの登録
// ----------------------------------------------------
canvas.addEventListener('mousedown', handleInputStartReal); 
canvas.addEventListener('touchstart', handleInputStartReal, {passive: false});
canvas.addEventListener('mousemove', handleInputMove); 
canvas.addEventListener('touchmove', handleInputMove, {passive: false});
canvas.addEventListener('mouseup', handleInputEnd); 
canvas.addEventListener('touchend', handleInputEnd, {passive: false});

</script>
