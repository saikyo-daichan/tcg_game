    try {

function playTone(f, t, d, v=0.1, delay=0) { 
    try { 
        if (!audioCtx) return; 
        v = v * masterVolume * 2; 
        if (v <= 0) return;
        setTimeout(() => {
            const o = audioCtx.createOscillator(); 
            const g = audioCtx.createGain(); 
            o.type = t; 
            o.frequency.value = f; 
            g.gain.setValueAtTime(v, audioCtx.currentTime); 
            g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d); 
            o.connect(g); 
            g.connect(audioCtx.destination); 
            o.start(); 
            o.stop(audioCtx.currentTime + d); 
        }, delay * 1000);
    } catch(e) {} 
}

        if (my >= 0 && my <= 100 && mx <= 150) { playClickSound(); gameState = 'MAIN_MENU'; return true; }
        return false;
    }
    if (gameState === 'BOSS_SELECT') {
        if (my >= 0 && my <= 100 && mx <= 150) { playClickSound(); gameState = 'MAIN_MENU'; return true; }
        if (isMenuHit(my, 200, 100)) { playClickSound(); bossLevel = 1; gameState = 'CLASS_SELECT'; gameMode = 'BOSS'; return true; }
        if (isMenuHit(my, 350, 100)) { playClickSound(); bossLevel = 2; gameState = 'CLASS_SELECT'; gameMode = 'BOSS'; return true; }
        if (isMenuHit(my, 500, 100)) { playClickSound(); bossLevel = 3; gameState = 'CLASS_SELECT'; gameMode = 'BOSS'; return true; }
        return false;
    }
    if (gameState === 'CLASS_SELECT') {
        if (my >= 0 && my <= 100 && mx <= 150) { playClickSound(); gameState = (gameMode === 'BOSS') ? 'BOSS_SELECT' : 'MAIN_MENU'; return true; }
        const keys = Object.keys(DECKS);
        for (let i = 0; i < keys.length; i++) {
            let dx = 70 + (i % 2) * 340; let dy = 160 + Math.floor(i / 2) * 150; 
            if (mx >= dx && mx <= dx + 310 && my >= dy && my <= dy + 110) { playClickSound(); selectedClassKey = keys[i]; gameState = 'ARCHETYPE_SELECT'; return true; }
        }
        return false;
    }
    if (gameState === 'ARCHETYPE_SELECT') {
        if (my >= 0 && my <= 100 && mx <= 150) { playClickSound(); gameState = 'CLASS_SELECT'; return true; }
        if (my >= 200 && my <= 310) { playClickSound(); initGame(gameMode, selectedClassKey, 'AGGRO'); return true; }
        if (my >= 350 && my <= 460) { playClickSound(); initGame(gameMode, selectedClassKey, 'CONTROL'); return true; }
        if (my >= 500 && my <= 610) { playClickSound(); initGame(gameMode, selectedClassKey, 'COMBO'); return true; }
        return false;
    }
    if (gameState === 'DRAFT') {
        for (let i = 0; i < 3; i++) {
            let dx = 150 + i * 180; if (mx >= dx && mx <= dx + 160 && my >= 300 && my <= 600) {
                playDraftSelectSound(); playerDeck.push(createCard(draftOptions[i])); draftCount++;
                if (draftCount >= 40) { startCoinToss(); } else { generateDraftOptions(); } return true;
            }
        }
        return false;
    }
    if (gameState === 'GAMEOVER') {
        if (my >= 500 && my <= 650) { playClickSound(); gameState = 'MAIN_MENU'; return true; }
        return false;
    }
    return false;
}

// ==========================================
// バトル中のタッチ・マウス処理
// ==========================================
let isHandlingTouch = false;

function handleInputStartReal(e) {
    if (e.cancelable) e.preventDefault(); 
    if (e.type === 'touchstart') isHandlingTouch = true;
    if (e.type === 'mousedown' && isHandlingTouch) return; 

    initAudio(); 
    const pos = getPointerPos(e); const mx = pos.x; const my = pos.y;
    
    if (gameState !== 'BATTLE' && gameState !== 'COIN_TOSS') { handleMenuInputs(mx, my); return; }
    
    if (zoomedCard) { playClickSound(); zoomedCard = null; return; }
    if (showBattleLog) { if (my >= 0 && my <= 100 && mx >= 600) { playClickSound(); showBattleLog = false; } return; }

    if (isAITurn || gameState === 'COIN_TOSS') {
        if (gameState === 'BATTLE' && mx >= 650 && my >= 620 && my <= 720) { playClickSound(); isHandHidden = !isHandHidden; }
        return;
    }

    if (mx >= 650 && my >= 10 && my <= 80) { playClickSound(); showBattleLog = true; return; }
    if (mx >= 650 && my >= 620 && my <= 720) { playClickSound(); isHandHidden = !isHandHidden; return; }
    if (!hasEvolvedThisTurn && playerEP > 0 && canPlayerEvolve() && mx <= 150 && my >= 520 && my <= 620) { evolveMode = !evolveMode; playClickSound(); return; }

    touchStartX = mx; touchStartY = my;
    let foundCardToZoom = null;

    if (!isHandHidden && !evolveMode) {
        for (let i = playerHand.length - 1; i >= 0; i--) {
            let c = playerHand[i];
            if (mx >= c.x && mx <= c.x + CARD_W && my >= c.y && my <= c.y + CARD_H) {
                foundCardToZoom = c;
                let cst = c.cost; if (c.ability.includes('VENGEANCE_COST_1') && playerHP <= 10) cst = 1;
                if (playerPP >= cst) { draggedCard = { card: c, index: i, type: 'HAND' }; dragOffset.x = mx - c.x; dragOffset.y = my - c.y; }
                break;
            }
        }
    }

    if (!foundCardToZoom) {
        [...playerBoard, ...enemyBoard, ...enemyHand].forEach(c => {
            if (mx >= c.x && mx <= c.x + CARD_W && my >= c.y && my <= c.y + CARD_H) { foundCardToZoom = c; }
        });
    }

    if (foundCardToZoom) {
        longPressTimer = setTimeout(() => { zoomedCard = foundCardToZoom; draggedCard = null; activeAttacker = null; playClickSound(); }, 400); 
    }

    if (draggedCard) { playClickSound(); return; }

    for (let i = 0; i < playerBoard.length; i++) {
        let c = playerBoard[i];
        if (mx >= c.x && mx <= c.x + CARD_W && my >= c.y && my <= c.y + CARD_H) {
            if (evolveMode && !c.isEvolved && c.type === 'FOLLOWER') {
                playerEP--; c.isEvolved = true; c.evolveTimer = 30;
                c.atk += 2; c.hp += 2; c.maxHp += 2; c.baseAtk += 2; c.baseHp += 2;
                if (!c.ready && c.attacksLeft > 0) { c.ready = true; if (!c.ability.includes('STORM')) c.rushThisTurn = true; }
                hasEvolvedThisTurn = true; evolveMode = false; playEvolveSound(); showPopup('進化！', '#ffeb3b'); 
                addBattleLog(`あなたの ${c.name} が進化！`, true); clearLongPress(); return;
            }
            if (c.ready && c.attacksLeft > 0 && !evolveMode && c.type === 'FOLLOWER') { playClickSound(); activeAttacker = { card: c, index: i }; return; }
        }
    }
    
    if (!evolveMode && mx >= 620 && my >= 350 && my <= 450) { playClickSound(); endTurn(); clearLongPress(); }
}

function handleInputMove(e) {
    const pos = getPointerPos(e); mousePos.x = pos.x; mousePos.y = pos.y;
    if (longPressTimer) { if (Math.abs(mousePos.x - touchStartX) > 10 || Math.abs(mousePos.y - touchStartY) > 10) { clearLongPress(); } }
    if (draggedCard) { draggedCard.card.x = mousePos.x - dragOffset.x; draggedCard.card.y = mousePos.y - dragOffset.y; }
    if (gameState === 'SETTINGS' && e.buttons > 0) {
        if (mousePos.x >= 200 && mousePos.x <= 600 && mousePos.y >= 250 && mousePos.y <= 350) {
            masterVolume = (mousePos.x - 200) / 400; if (masterVolume < 0) masterVolume = 0; if (masterVolume > 1) masterVolume = 1;
        }
    }
}

function handleInputEnd(e) {
    if (e.type === 'touchend') { setTimeout(() => { isHandlingTouch = false; }, 400); }
    clearLongPress();
    if (gameState !== 'BATTLE' || isAITurn || zoomedCard || showBattleLog) return;
    if (!draggedCard && !activeAttacker) return;
    
    const pos = getPointerPos(e); const mx = pos.x; const my = pos.y;

    if (draggedCard && draggedCard.type === 'HAND') {
        let c = draggedCard.card;
        if (my < 600) { 
            let targetEnemy = enemyBoard.find(enemy => mx >= enemy.x && mx <= enemy.x + CARD_W && my >= enemy.y && my <= enemy.y + CARD_H);
            let isFaceDrop = (my < 300 && !targetEnemy);
            let reqTarget = requiresTarget(c);
            let reqFollowerOnly = c.ability.some(a => a.includes('DEBUFF') || a.includes('KILL_TARGET') || a.includes('DESTROY_AMULET'));

            if (reqTarget) {
                if (targetEnemy) { playCardFromHand(draggedCard, targetEnemy, false, true); } 
                else if (isFaceDrop && !reqFollowerOnly) { playCardFromHand(draggedCard, null, true, true); } 
                else { showPopup("対象カードへ直接重ねてください", "#f00"); playErrorSound(); }
            } else {
                if (c.type === 'FOLLOWER' || c.type === 'AMULET') {
                    if (playerBoard.length < 5) playCardFromHand(draggedCard, null, false, true);
                    else { showPopup("盤面がいっぱいです！", "#f00"); playErrorSound(); }
                } else { playCardFromHand(draggedCard, null, false, true); }
            }
        }
        draggedCard = null;
    }

    if (activeAttacker) {
        let hasEnemyWard = enemyBoard.some(c => c.ability.includes('WARD') && !c.ability.includes('INVINCIBLE')); 
        let attackSuccess = false; let targetForAnim = null;

        for (let i = 0; i < enemyBoard.length; i++) {
            let enemy = enemyBoard[i];
            if (mx >= enemy.x && mx <= enemy.x + CARD_W && my >= enemy.y && my <= enemy.y + CARD_H && enemy.type === 'FOLLOWER') {
                if (hasEnemyWard && !enemy.ability.includes('WARD') && !enemy.ability.includes('INVINCIBLE')) { 
                    playErrorSound(); showPopup("【守護】を攻撃してください！", '#ff0000'); activeAttacker = null; return; 
                }
                let atkHasKill = activeAttacker.card.ability.includes('ATTACK_KILL'); let defHasKill = enemy.ability.includes('ATTACK_KILL');
                if (atkHasKill && !enemy.ability.includes('INVINCIBLE')) enemy.hp = 0; else if (!enemy.ability.includes('INVINCIBLE')) enemy.hp -= activeAttacker.card.atk; 
                if (defHasKill && !activeAttacker.card.ability.includes('INVINCIBLE')) activeAttacker.card.hp = 0; else if (!activeAttacker.card.ability.includes('INVINCIBLE')) activeAttacker.card.hp -= enemy.atk; 
                attackSuccess = true; targetForAnim = enemy; break;
            }
        }
        if (!attackSuccess && my < 300 && !activeAttacker.card.rushThisTurn) { 
            if (hasEnemyWard) { playErrorSound(); showPopup("敵の【守護】が邪魔です！", '#ff0000'); activeAttacker = null; return; }
            enemyHP -= activeAttacker.card.atk; attackSuccess = true; targetForAnim = 'FACE'; showPopup("ダイレクトアタック！！", '#ffaa00');
        } else if (!attackSuccess && my < 300 && activeAttacker.card.rushThisTurn) {
            playErrorSound(); showPopup("突進はリーダーを攻撃できません", '#f00'); activeAttacker = null; return;
        }
        
        if (attackSuccess) {
            playAttackSound(); playDamageSound();
            addBattleLog(`あなたの ${activeAttacker.card.name} が ${targetForAnim === 'FACE' ? '敵リーダー' : targetForAnim.name} に攻撃！`, true);

            activeAttacker.card.attackAnimTimer = 15;
            activeAttacker.card.attackTargetX = targetForAnim === 'FACE' ? 400 : targetForAnim.x + CARD_W/2;
            activeAttacker.card.attackTargetY = targetForAnim === 'FACE' ? 100 : targetForAnim.y + CARD_H/2;

            if (activeAttacker.card.ability.includes('ATTACK_LEADER_DMG_1')) playerHP -= 1;
            if (activeAttacker.card.ability.includes('HEAL_FULL_ON_KILL') && activeAttacker.card.hp > 0) activeAttacker.card.hp = activeAttacker.card.maxHp;
            activeAttacker.card.attacksLeft--; if (activeAttacker.card.attacksLeft <= 0) activeAttacker.card.ready = false;
        }
        checkDeath(); activeAttacker = null;
    }
    checkWinLoss();
}

// ----------------------------------------------------
// 物理イベントリスナー登録
// ----------------------------------------------------
canvas.addEventListener('mousedown', handleInputStartReal); 
canvas.addEventListener('touchstart', handleInputStartReal, {passive: false});
canvas.addEventListener('mousemove', handleInputMove); 
canvas.addEventListener('touchmove', handleInputMove, {passive: false});
canvas.addEventListener('mouseup', handleInputEnd); 
canvas.addEventListener('touchend', handleInputEnd, {passive: false});

</script>
