<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120a1e">
<title>デュエルデュエル</title>
<link rel="manifest" href="duelduel_manifest.json">
<link rel="icon" href="duelduel_data/img/CardGui/T_Logo2.webp">
<link rel="stylesheet" href="duelduel_data/font/font.css">
<style>
  html, body { margin: 0; height: 100%; background: #0b0614; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* #app = the landscape screen: turned 90° by kit.js FitApp when a phone is held upright */
  #app { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; transform-origin: 0 0; overflow: hidden; container-type: size; }
  #root { position: absolute; inset: 0; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #000;
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Meiryo', sans-serif; font-weight: 800; line-height: 1.18; }
  .w { box-sizing: border-box; }
  .cv { position: relative; width: 100%; height: 100%; pointer-events: none; }
  .slot { position: absolute; }
  .slot > .w { position: relative; }
  .fill > .w { width: 100% !important; height: 100% !important; }
  .tex { background-size: 100% 100%; background-repeat: no-repeat; pointer-events: none; }
  .tex > .tcv { width: 100%; height: 100%; display: block; }
  .cb { pointer-events: none; }
  .tx { pointer-events: none; }
  .tx.wrap { overflow-wrap: anywhere; }
  .ov { display: inline-grid; pointer-events: none; }
  .hit { pointer-events: auto; cursor: pointer; background: transparent; }
  #dragarrow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; display: none; }
  #loading { position: absolute; inset: 0; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    background: radial-gradient(ellipse at center, #3a1f63 0%, #120a1e 75%); color: #fff; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; }
  #loading img { width: min(70cqw, 900px); filter: drop-shadow(0 8px 24px rgba(0,0,0,.6)); }
  #loadtrack { width: min(60cqw, 600px); height: 14px; border-radius: 7px; background: rgba(255,255,255,.15); overflow: hidden; }
  #loadbar { width: 0; height: 100%; background: linear-gradient(90deg, #ffd84a, #ff9a3c); transition: width .2s; }
  #tapmsg { font-size: clamp(18px, 3cqw, 34px); opacity: 0; letter-spacing: .1em; }
  #loading.ready #tapmsg { opacity: 1; animation: blink 1.2s infinite; }
  #loading.ready #loadtrack { display: none; }
  @keyframes blink { 50% { opacity: .35; } }
  #namebox { position: absolute; inset: 0; z-index: 2100; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); }
  #namepanel { background: #2a1846; border: 4px solid #ffd84a; border-radius: 22px; padding: 28px 34px; color: #fff; text-align: center;
    font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; box-shadow: 0 12px 40px rgba(0,0,0,.6); width: min(86cqw, 520px); }
  #namepanel h2 { margin: 0 0 8px; font-size: 28px; color: #ffd84a; }
  #namepanel p { margin: 0 0 18px; font-size: 15px; opacity: .85; }
  #nameinput { width: 100%; box-sizing: border-box; font: inherit; font-size: 24px; padding: 10px 14px; border-radius: 12px; border: 3px solid #8a6cff; background: #fff; color: #222; text-align: center; -webkit-user-select: text; user-select: text; }
  #nameok { margin-top: 18px; font: inherit; font-size: 22px; padding: 10px 46px; border-radius: 999px; border: 0; background: linear-gradient(#ffe57a, #f0a623); color: #3a1d00; cursor: pointer; }
  /* フレンド (friends.js) */
  .frbox, .frinv { position: absolute; inset: 0; z-index: 2200; display: flex; align-items: center; justify-content: center; background: rgba(8,4,14,.62);
    font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; color: #3a230f; }
  .frinv { z-index: 2300; }
  .frpanel { width: min(94cqw, 1180px); height: min(92cqh, 700px); box-sizing: border-box; display: flex; flex-direction: column; gap: 1.2cqh;
    background: linear-gradient(#f6e9cc, #e9d4a8); border: 6px solid #6b4220; border-radius: 22px; box-shadow: 0 0 0 3px #d9a64a inset, 0 18px 50px rgba(0,0,0,.6);
    padding: 2.2cqh 2.4cqw; font-size: clamp(12px, 2.4cqh, 20px); }
  .frpanel.frsmall { width: min(80cqw, 620px); height: auto; text-align: center; gap: 2.4cqh; padding: 3.4cqh 3cqw; }
  .frhead { display: flex; align-items: center; justify-content: center; position: relative; }
  .frtitle { font-size: clamp(18px, 4.6cqh, 38px); color: #fff; text-shadow: 0 3px 0 #6b2b10, 0 0 8px rgba(0,0,0,.4); background: linear-gradient(#e2433f, #a8201f);
    border: 3px solid #ffd36a; border-radius: 12px; padding: .2em 1.6em; }
  .frx { position: absolute; right: 0; top: 0; width: 2.2em; height: 2.2em; border-radius: 50%; border: 3px solid #6b4220; background: #fff6e0; color: #6b4220; font: inherit; font-size: 1.2em; cursor: pointer; }
  .frsearch { display: flex; gap: .6em; align-items: center; }
  .frlens { font-size: 1.6em; }
  .frinput { flex: 1; min-width: 0; font: inherit; font-size: 1.2em; padding: .45em .8em; border-radius: 12px; border: 3px solid #8a6cff; background: #fff; color: #222; letter-spacing: .08em; -webkit-user-select: text; user-select: text; }
  .frnote { min-height: 1.3em; color: #2f6b1f; font-size: .95em; }
  .frnote.bad { color: #b3261e; }
  .frcols { flex: 1; min-height: 0; display: flex; gap: 1.6cqw; }
  .frcol { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .frcol.wide { flex: 1.6; }
  .frsub { font-size: 1.1em; color: #6b4220; border-bottom: 3px solid #c99a55; padding-bottom: .2em; margin-bottom: .4em; display: flex; align-items: center; gap: .6em; flex-wrap: wrap; }
  .frmode { margin-left: auto; font-size: .8em; display: flex; align-items: center; gap: .3em; }
  .frchip { font: inherit; padding: .2em .8em; border-radius: 999px; border: 2px solid #8a5a2a; background: #fff6e0; color: #6b4220; cursor: pointer; }
  .frchip.sel { background: linear-gradient(#ffe57a, #f0a623); color: #3a1d00; border-color: #a86a12; }
  .frlist { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding-right: .3em; }
  .frrow { display: flex; align-items: center; gap: .5em; background: rgba(255,255,255,.55); border: 2px solid #d2b07a; border-radius: 12px; padding: .45em .6em; margin-bottom: .45em; }
  .frrow.out { opacity: .75; }
  .frname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frname small { display: block; font-size: .72em; color: #6f5a3e; letter-spacing: .05em; }
  .frst { font-size: .85em; white-space: nowrap; }
  .frst.on { color: #1f8a2a; } .frst.bat { color: #d9730d; } .frst.off { color: #8c8c8c; } .frst.chk { color: #8c8c8c; }
  .frwait { font-size: .8em; color: #8a6a3a; }
  .frempty { color: #8a7050; padding: 1em .4em; text-align: center; }
  .frbtn { font: inherit; border: 0; border-radius: 999px; padding: .45em 1.2em; cursor: pointer; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35); box-shadow: 0 3px 0 rgba(0,0,0,.25); white-space: nowrap; }
  .frbtn.sm { padding: .35em .9em; font-size: .9em; }
  .frbtn.gold { background: linear-gradient(#ffe57a, #f0a623); color: #3a1d00; text-shadow: none; }
  .frbtn.blue { background: linear-gradient(#8fd0ff, #2f7fe0); }
  .frbtn.purple { background: linear-gradient(#e2a8ff, #8a3fd6); }
  .frbtn.grey { background: linear-gradient(#d8d0c4, #9a8f80); }
  .frbtn:disabled { opacity: .4; cursor: default; }
  .frfoot { text-align: center; color: #6b4220; font-size: .95em; }
  .frfoot b { color: #1a2f8a; letter-spacing: .08em; font-size: 1.15em; }
  .froff { color: #b3261e; font-size: .85em; }
  .frmsg { font-size: 1.2em; line-height: 1.6; }
  .frbtns { display: flex; gap: 1.2em; justify-content: center; }
  .frbtns .frbtn { font-size: 1.2em; padding: .5em 2em; }
  .frtime { color: #8a6a3a; }
  #fatal { position: fixed; left: 8px; bottom: 8px; color: #f66; z-index: 4000; font: 14px sans-serif; }
</style>
</head>
<body>
<div id="app">
<div id="root"></div>
<div id="loading">
  <img src="duelduel_data/img/CardGui/T_Logo2.webp" alt="デュエルデュエル">
  <div id="loadtrack"><div id="loadbar"></div></div>
  <div id="tapmsg">タップ / クリックしてスタート</div>
</div>
<div id="namebox"><div id="namepanel">
  <h2>プレイヤー名</h2>
  <p>対戦相手に表示される名前を入れてね（12文字まで）</p>
  <input id="nameinput" maxlength="12" autocomplete="off" spellcheck="false">
  <div><button id="nameok">けってい</button></div>
</div></div>
</div>
<div id="fatal"></div>
<script src="duelduel_data/lib/peerjs.min.js"></script>
<script src="duelduel_data/js/kit.js"></script>
<script src="duelduel_data/js/assets.js"></script>
<script src="duelduel_data/js/sfx.js"></script>
<script src="duelduel_data/js/data.js"></script>
<script src="duelduel_data/js/cards.js"></script>
<script src="duelduel_data/js/text.js"></script>
<script src="duelduel_data/js/vfx.js"></script>
<script src="duelduel_data/js/views.js"></script>
<script src="duelduel_data/js/board.js"></script>
<script src="duelduel_data/js/packfx.js"></script>
<script src="duelduel_data/js/rules.js"></script>
<script src="duelduel_data/js/boss.js"></script>
<script src="duelduel_data/js/tutorial.js"></script>
<script src="duelduel_data/js/save.js"></script>
<script src="duelduel_data/js/shop.js"></script>
<script src="duelduel_data/js/pass.js"></script>
<script src="duelduel_data/js/extra.js"></script>
<script src="duelduel_data/js/achieve.js"></script>
<script src="duelduel_data/js/decks.js"></script>
<script src="duelduel_data/js/menus.js"></script>
<script src="duelduel_data/js/lobby.js"></script>
<script src="duelduel_data/js/friends.js"></script>
<script src="duelduel_data/js/manager.js"></script>
<script src="duelduel_data/js/main.js"></script>
</body>
</html>
