function getTextColor(hex) {
    try {
        if (!hex) return '#fff';
        if (hex.length === 4) hex = '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3];
        let r = parseInt(hex.substring(1, 3), 16);
        let g = parseInt(hex.substring(3, 5), 16);
        let b = parseInt(hex.substring(5, 7), 16);
        let luminance = (r * 299 + g * 587 + b * 114) / 1000;
        return luminance > 140 ? '#111111' : '#ffffff'; // 明るい背景なら黒文字
    } catch(e) { return '#ffffff'; }
}

const ALL_CARDS = Object.keys(DECKS).reduce((acc, key) => acc.concat(DECKS[key]), []);

function createCard(base) {
    return { 
        name: base.name, type: base.type, cost: base.cost, atk: base.atk, hp: base.hp, maxHp: base.maxHp, color: base.color,
        id: Math.random(), ready: false, attacksLeft: 1, baseAtk: base.atk || 0,
        ability: base.ability ? [...base.ability] : [], 
        textColor: getTextColor(base.color), 
        desc: base.desc || '', 
        x: 400, y: 800, targetX: 400, targetY: 800 
    };
}

function buildDeck(deckKey) {
    let deck = [];
    if (deckKey === 'SATAN') {
        SATAN_DECK.forEach(c => { deck.push(createCard(c)); deck.push(createCard(c)); deck.push(createCard(c)); });
        return deck.sort(() => Math.random() - 0.5);
    }
    
    DECKS[deckKey].forEach(c => { deck.push(createCard(c)); deck.push(createCard(c)); deck.push(createCard(c)); });
    
    let neutralPool = [];
    NEUTRAL.forEach(c => { neutralPool.push(createCard(c)); neutralPool.push(createCard(c)); });
    neutralPool.sort(() => Math.random() - 0.5);
    for (let i = 0; i < 10; i++) { deck.push(neutralPool[i]); }
    
    return deck.sort(() => Math.random() - 0.5);
}

function drawCardToHand(isPlayer, amount = 1) {
    let hand = isPlayer ? playerHand : enemyHand;
    let deck = isPlayer ? playerDeck : enemyDeck;
    for(let i = 0; i < amount; i++) { if (deck.length > 0 && hand.length < 9) hand.push(deck.pop()); }
}

function initGame(playerDeckKey) {
    playerDeckType = playerDeckKey; playerDeck = buildDeck(playerDeckKey);
    const deckKeys = Object.keys(DECKS);
    enemyDeckType = deckKeys[Math.floor(Math.random() * deckKeys.length)];
    enemyDeck = buildDeck(enemyDeckType);

    turn = 1; playerHP = 20; enemyHP = 20;
    playerPP = 1; playerMaxPP = 1; enemyPP = 1; enemyMaxPP = 1;
    playerGrave = 0; enemyGrave = 0; cardsPlayedThisTurn = 0;
    playerHand = []; playerBoard = []; enemyHand = []; enemyBoard = [];
    draggedCard = null; activeAttacker = null; isHandHidden = false; popups = [];

    drawCardToHand(true, 4); drawCardToHand(false, 4);
    gameState = 'BATTLE';
    showPopup("BATTLE START!!", '#fff');
    showPopup(`敵のデッキ: ${DECK_INFO[enemyDeckType].name}`, DECK_INFO[enemyDeckType].color);
}

let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playTone(freq, type, duration, vol=0.1) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq; gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
}
function playSummonSound() { playTone(300, 'triangle', 0.15); playTone(600, 'triangle', 0.1, 0.05); }
function playAttackSound() { playTone(150, 'sawtooth', 0.12, 0.15); }
function playDamageSound() { playTone(80, 'sawtooth', 0.25, 0.2); }
function playSpellSound() { playTone(800, 'sine', 0.2, 0.1); playTone(1200, 'sine', 0.3, 0.1, 0.1); }
function playHealSound() { playTone(523.25, 'triangle', 0.15, 0.1); playTone(783.99, 'triangle', 0.2, 0.1, 0.08); }
function playErrorSound() { playTone(100, 'square', 0.1, 0.1); }

function showPopup(text, color='#fff') { popups.push({ text: text, color: color, y: 400, timer: 70 }); }

function checkDeath() {
    let newPlayerBoard = [];
    playerBoard.forEach(c => {
        if (c.hp <= 0) {
            playerGrave++; let abStr = c.ability.join(',');
            if (abStr.includes('DEATH_DRAW_1')) drawCardToHand(true, 1);
            if (abStr.includes('DEATH_SUMMON_SKELETON')) if(newPlayerBoard.length<5) newPlayerBoard.push(createCard(DECKS.NECRO[0]));
            if (abStr.includes('DEATH_SUMMON_SKELETON_2')) { if(newPlayerBoard.length<5) newPlayerBoard.push(createCard(DECKS.NECRO[0])); if(newPlayerBoard.length<5) newPlayerBoard.push(createCard(DECKS.NECRO[0])); }
            if (abStr.includes('DEATH_SUMMON_2_3_WARD')) { let w = createCard({name:'重装兵',type:'FOLLOWER',cost:3,atk:2,hp:3,maxHp:3,ability:['WARD'],color:'#777777',desc:'【守護】'}); newPlayerBoard.push(w); }

        } else {
            if (c.ability.includes('PAIN_TO_ATK')) c.atk = c.baseAtk + (c.maxHp - c.hp);

    });
    playerBoard = newPlayerBoard;

    let newEnemyBoard = [];

            if (abStr.includes('DEATH_SUMMON_MORDECAI')) { let m = createCard(c); m.hp = m.maxHp; m.ready = false; if(newEnemyBoard.length<5) newEnemyBoard.push(m); }
        } else {
            if (c.ability.includes('PAIN_TO_ATK')) c.atk = c.baseAtk + (c.maxHp - c.hp);
            newEnemyBoard.push(c);
        }
    });
    enemyBoard = newEnemyBoard;
}

    }
    if (abilityStr.includes('FANFARE_NECRO_4_TARGET_ENEMY_4')) {

    let faceMatch = abilityStr.match(/FACE_DMG_(\d+)/) || abilityStr.match(/BURN_FACE_(\d+)/);
    if (faceMatch) { let d = parseInt(faceMatch[1]); if (isPlayer) enemyHP -= d; else playerHP -= d; playSpellSound(); showPopup(`敵リーダーに${d}ダメ！`, '#ff5722'); }

    let targetMatch = abilityStr.match(/TARGET_ENEMY_(\d+)/);

        let d = parseInt(targetMatch[1]);
        if (targetEnemy) { targetEnemy.hp -= d; playSpellSound(); showPopup(`${d}ダメージ！`, '#1565c0'); }

    }

}

canvas.addEventListener('mousedown', (e) => {
    initAudio(); const rect = canvas.getBoundingClientRect(); const mx = e.clientX - rect.left; const my = e.clientY - rect.top;

    if (gameState === 'SELECT') {
        const keys = Object.keys(DECKS);
        keys.forEach((key, idx) => { let dx = 70 + (idx % 2) * 340; let dy = 160 + Math.floor(idx / 2) * 150; if (mx >= dx && mx <= dx + 310 && my >= dy && my <= dy + 110) initGame(key); });
        return;
    }
    if (gameState === 'GAMEOVER') { if (mx >= 300 && mx <= 500 && my >= 550 && my <= 600) gameState = 'SELECT'; return; }
    if (mx >= 680 && mx <= 780 && my >= 650 && my <= 700) { isHandHidden = !isHandHidden; return; }
    if (turn !== 1) return;

    if (!isHandHidden) {
        for (let i = playerHand.length - 1; i >= 0; i--) {
            let c = playerHand[i];
            if (mx >= c.x && mx <= c.x + CARD_W && my >= c.y && my <= c.y + CARD_H) {
                if (playerPP >= c.cost) { draggedCard = { card: c, index: i, type: 'HAND' }; dragOffset.x = mx - c.x; dragOffset.y = my - c.y; return; }
            }
        }
    }

    for (let i = 0; i < playerBoard.length; i++) {
        let c = playerBoard[i];
        if (mx >= c.x && mx <= c.x + CARD_W && my >= c.y && my <= c.y + CARD_H) {
            if (c.ready && c.attacksLeft > 0) { activeAttacker = { card: c, index: i }; return; }
        }
    }
    if (mx >= 650 && mx <= 780 && my >= 375 && my <= 425) endTurn();
});

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect(); mousePos.x = e.clientX - rect.left; mousePos.y = e.clientY - rect.top;
    if (draggedCard) { draggedCard.card.x = mousePos.x - dragOffset.x; draggedCard.card.y = mousePos.y - dragOffset.y; }
});

canvas.addEventListener('mouseup', (e) => {
    if (gameState !== 'BATTLE') return;
    if (!draggedCard && !activeAttacker) return;
    const rect = canvas.getBoundingClientRect(); const mx = e.clientX - rect.left; const my = e.clientY - rect.top;

    if (draggedCard && draggedCard.type === 'HAND') {
        let c = draggedCard.card;
        
        if (requiresTarget(c)) {
            let targetEnemy = enemyBoard.find(enemy => mx >= enemy.x && mx <= enemy.x + CARD_W && my >= enemy.y && my <= enemy.y + CARD_H);
            if (targetEnemy || my < 350) { 
                if (c.ability.join(',').includes('FANFARE_NECRO_4_TARGET_ENEMY_4') && playerGrave < 4) {
                    playErrorSound(); showPopup("墓地不足！", '#ff0000');
                } else {
                    playerPP -= c.cost; playerHand.splice(draggedCard.index, 1); cardsPlayedThisTurn++;
                    if (c.type === 'FOLLOWER') { 
                        if (c.ability.includes('STORM')) { c.ready = true; c.attacksLeft = 1; } else { c.ready = false; c.attacksLeft = c.ability.includes('TWICE_ATTACK') ? 2 : 1; }
                        playerBoard.push(c); playSummonSound(); 
                    }
                    executeAbility(c, true, targetEnemy);
                }
            }
        } 
        else if (my < 620) { 
            if (c.type === 'FOLLOWER' && playerBoard.length < 5) {
                playerPP -= c.cost; playerHand.splice(draggedCard.index, 1); cardsPlayedThisTurn++;
                if (c.ability.includes('STORM')) { c.ready = true; c.attacksLeft = 1; } else { c.ready = false; c.attacksLeft = c.ability.includes('TWICE_ATTACK') ? 2 : 1; }
                playerBoard.push(c); playSummonSound(); executeAbility(c, true);
            } 
            else if (c.type === 'SPELL') { playerPP -= c.cost; playerHand.splice(draggedCard.index, 1); cardsPlayedThisTurn++; executeAbility(c, true); }
        }
        draggedCard = null;
    }

    if (activeAttacker) {
        let hasEnemyWard = enemyBoard.some(c => c.ability.includes('WARD')); let attackSuccess = false;
        for (let i = 0; i < enemyBoard.length; i++) {
            let enemy = enemyBoard[i];
            if (mx >= enemy.x && mx <= enemy.x + CARD_W && my >= enemy.y && my <= enemy.y + CARD_H) {
                if (hasEnemyWard && !enemy.ability.includes('WARD')) { playErrorSound(); showPopup("【守護】を攻撃してください！", '#ff0000'); activeAttacker = null; return; }
                if (activeAttacker.card.ability.includes('ATTACK_KILL')) enemy.hp = 0; else enemy.hp -= activeAttacker.card.atk; 
                activeAttacker.card.hp -= enemy.atk; attackSuccess = true; break;
            }
        }
        if (!attackSuccess && my < 350) { 
            if (hasEnemyWard) { playErrorSound(); showPopup("敵の【守護】が邪魔で顔面を狙えない！", '#ff0000'); activeAttacker = null; return; }
            enemyHP -= activeAttacker.card.atk; attackSuccess = true; showPopup("ダイレクトアタック！！", '#ffaa00');
        }
        if (attackSuccess) {
            playAttackSound(); playDamageSound();
            if (activeAttacker.card.ability.includes('ATTACK_LEADER_DMG_1')) playerHP -= 1;
            if (activeAttacker.card.ability.includes('ATTACK_SELF_DMG_3')) activeAttacker.card.hp -= 3;
            activeAttacker.card.attacksLeft--; if (activeAttacker.card.attacksLeft <= 0) activeAttacker.card.ready = false;
        }
        checkDeath(); activeAttacker = null;
    }
    checkWinLoss();
});

function processTurnEndEffects(isPlayer) {
    let board = isPlayer ? playerBoard : enemyBoard;
    board.forEach(c => {
        if (c.ability.includes('TURN_END_HEAL_4')) { if (isPlayer) playerHP = Math.min(20, playerHP + 4); else enemyHP = Math.min(20, enemyHP + 4); showPopup(`ターン終了回復`, '#fbc02d'); }
        if (c.ability.includes('TURN_END_HEAL_FULL')) { c.hp = c.maxHp; }
        if (c.ability.includes('TURN_END_HEAL_2')) { if (isPlayer) playerHP = Math.min(20, playerHP + 2); else enemyHP = Math.min(20, enemyHP + 2); }
    });
}

function endTurn() {
    if (turn !== 1) return;
    processTurnEndEffects(true);
    turn = 2; showPopup("相手のターン", '#aaa');
    if (enemyMaxPP < 10) enemyMaxPP++; enemyPP = enemyMaxPP;
    enemyBoard.forEach(c => { c.ready = true; c.attacksLeft = c.ability.includes('TWICE_ATTACK') ? 2 : 1; });
    cardsPlayedThisTurn = 0; 
    drawCardToHand(false, 1);
    setTimeout(enemyAIAction, 1000);
}

function enemyAIAction() {
    if(gameState !== 'BATTLE') return;

    try {
        let sortedHand = enemyHand.slice().sort((a,b) => a.cost - b.cost);
        for (let i = 0; i < sortedHand.length; i++) {
            let c = sortedHand[i]; let handIdx = enemyHand.indexOf(c);
            if (handIdx === -1) continue;
            
            if (enemyPP >= c.cost) {
                let target = null;
                if (requiresTarget(c)) {
                    if (playerBoard.length > 0) target = playerBoard[Math.floor(Math.random() * playerBoard.length)];
                    else if (!c.ability.join(',').includes('TARGET_ENEMY_MUST')) target = null;
                    else continue; 
                }
                
                if (c.type === 'SPELL') {
                    enemyPP -= c.cost; enemyHand.splice(handIdx, 1); cardsPlayedThisTurn++; executeAbility(c, false, target);
                } else if (c.type === 'FOLLOWER' && enemyBoard.length < 5) {
                    if (c.ability.join(',').includes('FANFARE_NECRO_4_TARGET_ENEMY_4') && enemyGrave < 4) continue;
                    enemyPP -= c.cost; enemyHand.splice(handIdx, 1); cardsPlayedThisTurn++;
                    if (c.ability.includes('STORM')) { c.ready = true; c.attacksLeft = 1; } else { c.ready = false; c.attacksLeft = c.ability.includes('TWICE_ATTACK') ? 2 : 1; }
                    enemyBoard.push(c); playSummonSound(); executeAbility(c, false, target);
                }
            }
        }
    } catch (e) {}

    setTimeout(() => {
        if(gameState !== 'BATTLE') return;
        try {
            enemyBoard.forEach(enemyFighter => {
                if (!enemyFighter.ready || enemyFighter.hp <= 0) return;
                let attacks = enemyFighter.attacksLeft;
                for (let a = 0; a < attacks; a++) {
                    if (enemyFighter.hp <= 0) break;
                    let target = null; let playerWards = playerBoard.filter(c => c.ability.includes('WARD'));

                    if (playerWards.length > 0) target = playerWards.find(w => enemyFighter.atk >= w.hp) || playerWards[0];
                    else {
                        let bestTrade = null; let bestScore = -100;
                        playerBoard.forEach(pf => {
                            let score = 0; let canKill = (enemyFighter.atk >= pf.hp || enemyFighter.ability.includes('ATTACK_KILL')); 
                            let willDie = (enemyFighter.hp <= pf.atk || pf.ability.includes('ATTACK_KILL'));
                            if (canKill && !willDie) score = 50 + pf.atk * 10;
                            else if (canKill && willDie) score = (pf.atk >= enemyFighter.atk || pf.cost >= enemyFighter.cost) ? 20 + pf.atk * 5 : -10;
                            else if (!canKill && willDie) score = -50; 
                            if (score > bestScore && score > 0) { bestScore = score; bestTrade = pf; }
                        });
                        if (enemyFighter.atk >= playerHP) target = null; else if (bestTrade) target = bestTrade;
                    }

                    if (target) {
                        if (enemyFighter.ability.includes('ATTACK_KILL')) target.hp = 0; else target.hp -= enemyFighter.atk; 
                        enemyFighter.hp -= target.atk;
                    } else { playerHP -= enemyFighter.atk; }
                    
                    if (enemyFighter.ability.includes('ATTACK_LEADER_DMG_1')) enemyHP -= 1;
                    if (enemyFighter.ability.includes('ATTACK_SELF_DMG_3')) enemyFighter.hp -= 3;
                    
                    playAttackSound(); playDamageSound();
                    enemyFighter.attacksLeft--; if (enemyFighter.attacksLeft <= 0) enemyFighter.ready = false;
                    checkDeath(); if (playerHP <= 0) break;
                }
            });
        } catch (e) {}
        
        setTimeout(() => {
            checkWinLoss(); if(gameState !== 'BATTLE') return;
            processTurnEndEffects(false);
            if (playerMaxPP < 10) playerMaxPP++; playerPP = playerMaxPP;
            playerBoard.forEach(c => { c.ready = true; c.attacksLeft = c.ability.includes('TWICE_ATTACK') ? 2 : 1; });
            cardsPlayedThisTurn = 0; 
            drawCardToHand(true, 1);
            turn = 1; showPopup("あなたのターン！", '#00f2fe'); isHandHidden = false; 
        }, 1000);
    }, 1000);
}

function checkWinLoss() {
    if (playerHP <= 0 || enemyHP <= 0) {
        gameState = 'GAMEOVER'; 
        if (playerHP <= 0) winMessage = 'YOU LOSE...'; else { winMessage = 'YOU WIN!!'; playerGold += 100; showPopup("100 G獲得！", '#ffd700'); }
    }
}

function updateCardPositions() {
    let phLen = playerHand.length;
    playerHand.forEach((c, idx) => {
        if (draggedCard && draggedCard.card === c) return; 
        let offset = idx - (phLen - 1) / 2;
        c.targetX = (canvas.width / 2 - CARD_W / 2) + offset * 80; c.targetY = isHandHidden ? 900 : (630 + Math.abs(offset) * 8); 
        c.x += (c.targetX - c.x) * 0.15; c.y += (c.targetY - c.y) * 0.15; 
    });

    let ehLen = enemyHand.length;
    enemyHand.forEach((c, idx) => {
        let offset = idx - (ehLen - 1) / 2;
        c.targetX = (canvas.width / 2 - CARD_W / 2) + offset * 60; c.targetY = turn === 1 ? -150 : -50 + Math.abs(offset) * 5; 
        c.x += (c.targetX - c.x) * 0.15; c.y += (c.targetY - c.y) * 0.15;
    });

    let pbLen = playerBoard.length;
    playerBoard.forEach((c, idx) => {
        let offset = idx - (pbLen - 1) / 2;
        c.targetX = (canvas.width / 2 - CARD_W / 2) + offset * (CARD_W + 15); c.targetY = 450;
        c.x += (c.targetX - c.x) * 0.2; c.y += (c.targetY - c.y) * 0.2;
    });

    let ebLen = enemyBoard.length;
    enemyBoard.forEach((c, idx) => {
        let offset = idx - (ebLen - 1) / 2;
        c.targetX = (canvas.width / 2 - CARD_W / 2) + offset * (CARD_W + 15); c.targetY = 250;
        c.x += (c.targetX - c.x) * 0.2; c.y += (c.targetY - c.y) * 0.2;
    });
}

function drawCard(c, isEnemy = false, isPlayable = false) {
    ctx.save();
    if (c.ready && c.attacksLeft > 0 && !isEnemy && playerBoard.includes(c)) { ctx.shadowBlur = 15; ctx.shadowColor = '#00f2fe'; } 
    else if (isPlayable && c.type !== 'ENEMY_HAND' && !isHandHidden) { ctx.shadowBlur = 10; ctx.shadowColor = '#00ff66'; } 
    else { ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(0,0,0,0.6)'; }
    
    ctx.fillStyle = c.color || '#333'; ctx.fillRect(c.x, c.y, CARD_W, CARD_H);
    ctx.lineWidth = 3;
    if (c.type === 'ENEMY_HAND') ctx.strokeStyle = '#555';
    else if (c.ability.includes('WARD')) { ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 5; }
    else if (c.type === 'SPELL') ctx.strokeStyle = '#9c27b0'; else ctx.strokeStyle = '#222';
    
    ctx.strokeRect(c.x, c.y, CARD_W, CARD_H); ctx.restore();

    if (c.type === 'ENEMY_HAND') { ctx.fillStyle = '#111'; ctx.fillRect(c.x+5, c.y+5, CARD_W-10, CARD_H-10); return; }

    ctx.fillStyle = c.textColor; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(c.name, c.x + CARD_W/2, c.y + 25);
    ctx.font = '10px sans-serif';
    const lines = (c.desc || '').split('\n'); lines.forEach((line, i) => ctx.fillText(line, c.x + CARD_W/2, c.y + 50 + (i * 12)));

    ctx.fillStyle = '#0055ff'; ctx.beginPath(); ctx.arc(c.x + 14, c.y + 14, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.fillText(c.cost, c.x + 14, c.y + 19);

    if (c.type === 'FOLLOWER') {
        ctx.fillStyle = '#ffaa00'; ctx.beginPath(); ctx.arc(c.x + 14, c.y + CARD_H - 14, 12, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = (c.atk > c.baseAtk) ? '#00ff00' : '#fff'; ctx.fillText(c.atk, c.x + 14, c.y + CARD_H - 9);
        ctx.fillStyle = '#ff2255'; ctx.beginPath(); ctx.arc(c.x + CARD_W - 14, c.y + CARD_H - 14, 12, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = (c.hp < c.maxHp) ? '#ff9999' : '#fff'; ctx.fillText(c.hp, c.x + CARD_W - 14, c.y + CARD_H - 9);
    }
}

function drawSelectScreen() {
    ctx.fillStyle = '#0b0c16'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffd700'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'right'; ctx.fillText(`所持金: ${playerGold} G`, canvas.width - 20, 40);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('使用するデッキを選択してください', canvas.width/2, 100);

    const keys = Object.keys(DECKS);
    keys.forEach((key, idx) => {
        let dx = 70 + (idx % 2) * 340; let dy = 160 + Math.floor(idx / 2) * 150; let info = DECK_INFO[key];
        ctx.fillStyle = info.color; ctx.fillRect(dx, dy, 310, 110);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(dx, dy, 310, 110);
        ctx.fillStyle = getTextColor(info.color); ctx.font = 'bold 20px sans-serif'; ctx.fillText(info.name, dx + 155, dy + 40);
        ctx.font = '12px sans-serif'; ctx.fillText(info.desc, dx + 155, dy + 75);
    });
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = playerHP <= 0 ? '#ff3333' : '#00f2fe'; ctx.font = 'bold 60px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(winMessage, canvas.width/2, canvas.height/2 - 50);
    ctx.fillStyle = '#3f51b5'; ctx.fillRect(300, 550, 200, 50); ctx.strokeStyle = '#fff'; ctx.strokeRect(300, 550, 200, 50);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.fillText('デッキ選択へ戻る', 400, 583);
}

function drawBattle() {
    let grad = ctx.createLinearGradient(0, 0, 0, canvas.height); grad.addColorStop(0, '#0a0a1a'); grad.addColorStop(0.5, '#1a1a2e'); grad.addColorStop(1, '#0a0a1a');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 400); ctx.lineTo(canvas.width, 400); ctx.stroke();

    ctx.fillStyle = '#3f51b5'; ctx.beginPath(); ctx.arc(400, 90, 50, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`ENEMY: ${enemyHP}`, 400, 95);
    ctx.fillStyle = '#e91e63'; ctx.beginPath(); ctx.arc(400, 710, 50, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#fff'; ctx.fillText(`YOU: ${playerHP}`, 400, 715);

    ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left';
    ctx.fillStyle = '#00f2fe'; ctx.fillText(`PP: ${playerPP} / ${playerMaxPP}`, 30, 740);
    if (playerDeckType === 'NECRO') { ctx.fillStyle = '#aa00ff'; ctx.fillText(`墓地: ${playerGrave}`, 30, 770); }
    if (playerDeckType === 'ELF') { ctx.fillStyle = '#8bc34a'; ctx.fillText(`プレイ枚数: ${cardsPlayedThisTurn}`, 30, 770); }
    
    ctx.fillStyle = '#ff0055'; ctx.fillText(`敵PP: ${enemyPP} / ${enemyMaxPP}`, 30, 60);
    if (enemyDeckType === 'NECRO') { ctx.fillStyle = '#aa00ff'; ctx.fillText(`敵墓地: ${enemyGrave}`, 30, 90); }

    ctx.fillStyle = turn === 1 ? '#00f2fe' : '#333'; ctx.fillRect(650, 375, 130, 50); ctx.strokeStyle = '#fff'; ctx.strokeRect(650, 375, 130, 50);
    ctx.fillStyle = turn === 1 ? '#000' : '#888'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(turn === 1 ? 'ターン終了' : '相手のターン', 715, 405);
    ctx.fillStyle = isHandHidden ? '#4caf50' : '#d32f2f'; ctx.fillRect(680, 650, 100, 50); ctx.strokeStyle = '#fff'; ctx.strokeRect(680, 650, 100, 50);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.fillText(isHandHidden ? '手札を出す' : '手札を隠す', 730, 680);

    updateCardPositions();
    enemyBoard.forEach(c => drawCard(c, true)); playerBoard.forEach(c => drawCard(c, false));
    enemyHand.forEach(c => drawCard({ ...c, type: 'ENEMY_HAND' }, true)); playerHand.forEach(c => drawCard(c, false, playerPP >= c.cost)); 

    if (draggedCard) drawCard(draggedCard.card, false, true);

    if (activeAttacker) {
        ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 6; ctx.setLineDash([10, 10]); ctx.beginPath(); ctx.moveTo(activeAttacker.card.x + CARD_W/2, activeAttacker.card.y + CARD_H/2);
        ctx.lineTo(mousePos.x, mousePos.y); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = '#ff0055'; ctx.beginPath(); ctx.arc(mousePos.x, mousePos.y, 10, 0, Math.PI*2); ctx.fill();
    }

    for (let i = popups.length - 1; i >= 0; i--) {
        let p = popups[i]; ctx.fillStyle = p.color; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center'; ctx.shadowBlur = 10; ctx.shadowColor = '#000'; ctx.fillText(p.text, 400, p.y);
        p.y -= 1; p.timer--; ctx.shadowBlur = 0; if (p.timer <= 0) popups.splice(i, 1);
    }
}

function draw() {
    if (gameState === 'SELECT') drawSelectScreen();
    else if (gameState === 'BATTLE') drawBattle();
    else if (gameState === 'GAMEOVER') { drawBattle(); drawGameOver(); }
}

function gameLoop() { draw(); requestAnimationFrame(gameLoop); }
gameLoop();
</script>
